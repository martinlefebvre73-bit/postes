<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Principal</title>
  <!-- Bootstrap CSS pour l'interface de connexion -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background-color: #0d1b2a; /* Fond bleu foncé professionnel */
      color: #e0e0e0;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .card {
      position: relative;
      background: #1b263b;
      max-width: 420px;
      width: 100%;
      margin: 0 auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      border: 1px solid #415a77;
      overflow: hidden; /* Empêche le filigrane de dépasser des bords arrondis */
    }

    /* Style du logo en filigrane en arrière-plan de la carte */
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('poste.webp');
      background-repeat: no-repeat;
      background-position: center;
      background-size: 60%;
      opacity: 0.07; /* Ajustez la transparence ici (0.0 à 1.0) */
      pointer-events: none; /* Permet de cliquer à travers le filigrane */
      z-index: 0;
    }

    /* S'assure que le contenu reste au-dessus du filigrane */
    .card > * {
      position: relative;
      z-index: 1;
    }

    h1, h2, h3 {
      color: #ffffff;
    }
    .menu {
      margin-top: 20px;
    }
    button {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      background-color: #0d6efd;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    button:hover {
      background-color: #0b5ed7;
    }
    button.btn-danger {
      background-color: #dc3545;
    }
    button.btn-danger:hover {
      background-color: #bb2d3b;
    }
    button.btn-success {
      background-color: #198754;
    }
    button.btn-success:hover {
      background-color: #157347;
    }
    button.btn-secondary {
      background-color: #495057;
    }
    button.btn-secondary:hover {
      background-color: #343a40;
    }
    #menuSecondaire {
      display: none;
    }
  </style>
</head>
<body>

  <!-- ÉCRAN DE CONNEXION (Affiché par défaut) -->
  <div class="card" id="vue-connexion">
    <h3 class="mb-4">Connexion Superviseur</h3>
    <form id="formConnexion">
      <div class="mb-3 text-start">
        <label class="form-label text-light">Courriel</label>
        <input type="email" class="form-control bg-dark text-light border-secondary" id="emailConnexion" required placeholder="nom@entreprise.com">
      </div>
      <div class="mb-4 text-start">
        <label class="form-label text-light">Mot de passe</label>
        <input type="password" class="form-control bg-dark text-light border-secondary" id="passwordConnexion" required placeholder="Mot de passe">
      </div>
      <button type="submit" class="btn btn-primary w-100">Se connecter</button>
    </form>
  </div>

  <!-- APPLICATION PRINCIPALE / MENU (Masquée tant que non connecté) -->
  <div class="card d-none" id="app-container">
    <div class="menu" id="menuPrincipal">
      <h1>Menu principal</h1>
      <button onclick="location.href='casier 1.html'">Vérification casier</button>
      <button onclick="ouvrirDirectoire()">Directoire</button>
      <button class="btn-danger" onclick="location.href='Rapport.html'">Problème de livraison</button>
      <!-- Bouton Intervention SST pointant vers interventions.html -->
      <button class="btn-success" onclick="location.href='interventions.html'">Intervention SST</button>
      <button class="btn-secondary mt-4" onclick="deconnecterUtilisateur()">Déconnexion</button>
    </div>

    <div class="menu" id="menuSecondaire">
      <h2>Menu secondaire</h2>
      <button onclick="ouvrirRoute()">Route</button>
      <button class="btn-secondary" onclick="retourMenu()">Retour</button>
    </div>
  </div>

  <!-- SCRIPTS FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBksqM25AZOEPLmaOcbOHjORx78sGyGicc",
        authDomain: "postesst.firebaseapp.com",
        projectId: "postesst",
        storageBucket: "postesst.firebasestorage.app",
        messagingSenderId: "39362155503",
        appId: "1:39362155503:web:26b59f9eca20443c4c9c1a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Gestion de la soumission de connexion
    document.getElementById('formConnexion').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('emailConnexion').value;
        const password = document.getElementById('passwordConnexion').value;

        try {
            await signInWithEmailAndPassword(auth, email, password);
            document.getElementById('formConnexion').reset();
        } catch (error) {
            alert("Erreur de connexion : Identifiants incorrects.");
            console.error(error);
        }
    });

    // Gestion de la déconnexion globale
    window.deconnecterUtilisateur = async () => {
        try {
            await signOut(auth);
        } catch (error) {
            console.error("Erreur lors de la déconnexion :", error);
        }
    };

    // Vérification de l'état de l'authentification en temps réel
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // Utilisateur connecté : Afficher le menu principal et masquer le formulaire
            document.getElementById('vue-connexion').classList.add('d-none');
            document.getElementById('app-container').classList.remove('d-none');
        } else {
            // Utilisateur déconnecté : Afficher le formulaire et masquer le menu
            document.getElementById('app-container').classList.add('d-none');
            document.getElementById('vue-connexion').classList.remove('d-none');
        }
    });
  </script>

  <script>
    function ouvrirDirectoire() {
      document.getElementById('menuPrincipal').style.display = 'none';
      document.getElementById('menuSecondaire').style.display = 'block';
    }

    function retourMenu() {
      document.getElementById('menuSecondaire').style.display = 'none';
      document.getElementById('menuPrincipal').style.display = 'block';
    }

    function ouvrirRoute() {
      const numero = prompt('Entrez le numéro de route :');
      if (numero && numero.trim() !== '') {
        const routeNettoyee = numero.trim();
        localStorage.setItem('numeroRoute', routeNettoyee);
        location.href = encodeURIComponent(routeNettoyee) + '.htm';
      }
    }
  </script>

</body>
</html>
