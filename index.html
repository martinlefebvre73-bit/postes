<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Principal</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    text-align: center;
    padding-top: 50px;
}

button {
    display: block;
    width: 300px;
    margin: 10px auto;
    padding: 15px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background-color: #0078D7;
    color: white;
    cursor: pointer;
}

button:hover {
    background-color: #005fa3;
}

.retour {
    background-color: #666;
}

.retour:hover {
    background-color: #444;
}

#menuSecondaire {
    display: none;
}
</style>
</head>

<body>

<!-- MENU PRINCIPAL -->
<div id="menuPrincipal">
    <h1>Menu Principal</h1>

   <button onclick="verification-casier.html">
        Vérification Casier
    </button>

    <button onclick="ouvrirDirectoires()">
        Directoires
    </button>
</div>

<!-- MENU SECONDAIRE -->
<div id="menuSecondaire">
    <h1>Directoires</h1>

    <button onclick="ouvrirRoute()">
        Route
    </button>

    recherche.html
        Recherche
    </button>

    <button class="retour" onclick="retourMenu()">
        Retour au menu principal
    </button>
</div>

<script>
function ouvrirDirectoires() {
    document.getElementById("menuPrincipal").style.display = "none";
    document.getElementById("menuSecondaire").style.display = "block";
}

function retourMenu() {
    document.getElementById("menuSecondaire").style.display = "none";
    document.getElementById("menuPrincipal").style.display = "block";
}

function ouvrirRoute() {
    let numero = prompt("Entrez le numéro de route :");

    if (numero && numero.trim() !== "") {
        location.href = numero.trim() + ".html";
    }
}
</script>

</body>
</html>
