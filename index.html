<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Principal</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;text-align:center;padding-top:50px}
button{display:block;width:300px;margin:10px auto;padding:15px;font-size:18px;border:none;border-radius:8px;background:#0078D7;color:white;cursor:pointer}
button:hover{background:#005fa3}
.retour{background:#666}.retour:hover{background:#444}
#menuSecondaire{display:none}
</style>
</head>
<body>
<div id="menuPrincipal">
<h1>Menu Principal</h1>
<button onclick="location.href='casier 1.html'">Vérification Casiers</button>
<button onclick="ouvrirDirectoires()">Directoires</button>
<button class="retour" onclick="history.back()">Retour</button>
</div>
<div id="menuSecondaire">
<h1>Directoires</h1>
<button onclick="location.href='recherche_blp.html'">Recherche BLP</button>
<button onclick="location.href='recherche_route.html'">Recherche Route</button>
<button onclick="location.href='recherche_adresse.html'">Recherche Adresse</button>
<button class="retour" onclick="retourMenu()">Retour au menu principal</button>
</div>
<script>
function ouvrirDirectoires(){document.getElementById('menuPrincipal').style.display='none';document.getElementById('menuSecondaire').style.display='block';}
function retourMenu(){document.getElementById('menuSecondaire').style.display='none';document.getElementById('menuPrincipal').style.display='block';}
</script>
</body>
</html>
