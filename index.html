  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBksqM25AZOEPLmaOcbOHjORx78sGyGicc",
        authDomain: "postesst.firebaseapp.com",
        projectId: "postesst",
        storageBucket: "postesst.firebasestorage.app",
        messagingSenderId: "39362155503",
        appId: "1:39362155503:web:26b59f9eca20443c4c9c1a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('formConnexion').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('emailConnexion').value;
        const password = document.getElementById('passwordConnexion').value;
        try {
            await signInWithEmailAndPassword(auth, email, password);
            document.getElementById('formConnexion').reset();
        } catch (error) {
            alert("Erreur de connexion : Identifiants incorrects.");
            console.error(error);
        }
    });

    window.deconnecterUtilisateur = async () => {
        try { await signOut(auth); } catch (error) { console.error(error); }
    };

    onAuthStateChanged(auth, (user) => {
        const btnChef = document.getElementById('btnChef');
        const btnBooker = document.getElementById('btnBooker');
        const btnGestionFirebase = document.getElementById('btnGestionFirebase');

        if (user) {
            document.getElementById('vue-connexion').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');

            const utilisateursAutorises = [
                "sandra.dostie@canadapost.ca",
                "caroline.gauthier@canadapost.ca",
                "martin.lefebvre@canadapost.ca"
            ];

            if (user.email && utilisateursAutorises.includes(user.email.toLowerCase().trim())) {
                btnChef.classList.remove('hidden');
                btnBooker.classList.remove('hidden');
            } else {
                btnChef.classList.add('hidden');
                btnBooker.classList.add('hidden');
            }

            // Bouton réservé uniquement à martin.lefebvre@canadapost.ca
            if (user.email && user.email.toLowerCase().trim() === "martin.lefebvre@canadapost.ca") {
                btnGestionFirebase.classList.remove('hidden');
            } else {
                btnGestionFirebase.classList.add('hidden');
            }

        } else {
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('vue-connexion').classList.remove('hidden');
            
            btnChef.classList.add('hidden');
            btnBooker.classList.add('hidden');
            if (btnGestionFirebase) btnGestionFirebase.classList.add('hidden');
        }
    });
  </script>
