<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postes Canada — Menu Principal</title>
  
  <!-- Configuration PWA / Application Mobile -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1b2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="image.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts : Cinzel & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Configuration Tailwind personnalisée -->
  <script>
      tailwind.config = {
          theme: {
              extend: {
                  colors: {
                      luxuryBlack: '#0d1b2a', /* Fond bleu foncé professionnel */
                      luxuryCard: '#1b263b', /* Fond de carte bleu un peu plus clair */
                      gold: '#d4af37',
                      beigeSoft: '#e0e0e0',
                      beigeMuted: '#a5b4fc',
                  },
                  fontFamily: {
                      serif: ['Cinzel', 'serif'],
                      sans: ['Plus Jakarta Sans', 'sans-serif'],
                  }
              }
          }
      }
  </script>
  <style>
      ::-webkit-scrollbar {
          width: 8px;
      }
      ::-webkit-scrollbar-track {
          background: #0d1b2a;
      }
      ::-webkit-scrollbar-thumb {
          background: #415a77;
          border-radius: 4px;
      }
      .card-border {
          border: 1px solid #415a77;
      }

      /* Style du logo en filigrane en arrière-plan de la carte */
      .card-watermark {
        position: relative;
        overflow: hidden;
      }
      .card-watermark::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('image.png');
        background-repeat: no-repeat;
        background-position: center;
        background-size: 60%;
        opacity: 0.07; /* Transparence du filigrane */
        pointer-events: none; /* Permet de cliquer à travers le filigrane */
        z-index: 0;
      }
      .card-watermark > * {
        position: relative;
        z-index: 1;
      }
  </style>
</head>
<body class="bg-luxuryBlack text-beigeSoft font-sans antialiased selection:bg-blue-500 selection:text-white min-h-screen flex flex-col items-center justify-center p-6 relative overflow-x-hidden">

  <!-- ÉCRAN DE CONNEXION (Affiché par défaut) -->
  <div class="w-full max-w-md bg-luxuryCard p-8 rounded-2xl card-border shadow-2xl relative z-10 card-watermark" id="vue-connexion">
    <div class="text-center mb-6">
      <div class="w-16 h-16 rounded-full border border-blue-400/40 flex items-center justify-center bg-blue-500/10 mx-auto mb-3 overflow-hidden p-1">
          <img src="image.png" alt="Postes Canada" class="w-full h-full object-contain">
      </div>
      <h3 class="font-serif text-2xl font-bold text-white">Connexion Superviseur</h3>
      <span class="text-[10px] tracking-[0.25em] text-beigeMuted uppercase">Postes Canada • Dépôt Aéroport</span>
    </div>

    <form id="formConnexion">
      <div class="mb-4 text-start">
        <label class="block text-xs uppercase tracking-wider text-beigeMuted mb-2">Courriel</label>
        <input type="email" class="w-full px-4 py-3 rounded-xl bg-luxuryBlack text-white card-border focus:outline-none focus:border-blue-500 transition-colors text-sm" id="emailConnexion" required placeholder="nom@entreprise.com">
      </div>
      <div class="mb-6 text-start">
        <label class="block text-xs uppercase tracking-wider text-beigeMuted mb-2">Mot de passe</label>
        <input type="password" class="w-full px-4 py-3 rounded-xl bg-luxuryBlack text-white card-border focus:outline-none focus:border-blue-500 transition-colors text-sm" id="passwordConnexion" required placeholder="Mot de passe">
      </div>
      <button type="submit" class="w-full py-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs tracking-widest uppercase shadow-lg shadow-blue-600/30 transition-all cursor-pointer">Se connecter</button>
    </form>
  </div>

  <!-- APPLICATION PRINCIPALE / MENU (Masquée par défaut via la classe 'hidden') -->
  <div class="w-full max-w-md bg-luxuryCard p-8 rounded-2xl card-border shadow-2xl relative z-10 card-watermark hidden" id="app-container">
    
    <!-- Menu Principal -->
    <div class="menu" id="menuPrincipal">
      <div class="text-center mb-6">
        <div class="w-16 h-16 rounded-full border border-blue-400/40 flex items-center justify-center bg-blue-500/10 mx-auto mb-3 overflow-hidden p-1">
            <img src="image.png" alt="Postes Canada" class="w-full h-full object-contain">
        </div>
        <span class="text-[10px] tracking-[0.25em] text-blue-400 uppercase font-semibold">Postes Canada</span>
        <h1 class="font-serif text-2xl sm:text-3xl font-bold text-white mt-1">Menu Principal</h1>
      </div>

      <div class="space-y-4">
        <!-- Bouton Documents (Bleu) -->
        <button onclick="ouvrirMenuDocuments()" class="w-full py-4 px-6 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs tracking-widest uppercase shadow-lg shadow-blue-600/30 transition-all cursor-pointer">Documents</button>
        
        <!-- Bouton Problème de livraison (Rouge) -->
        <button onclick="location.href='Rapport.html'" class="w-full py-4 px-6 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-xs tracking-widest uppercase shadow-lg shadow-red-600/30 transition-all cursor-pointer">Problème de livraison</button>
        
        <!-- Bouton Intervention SST (Vert) -->
        <button onclick="location.href='interventions.html'" class="w-full py-4 px-6 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs tracking-widest uppercase shadow-lg shadow-emerald-600/30 transition-all cursor-pointer">Intervention SST</button>
        
        <!-- Bouton Déconnexion (Gris foncé) -->
        <button onclick="deconnecterUtilisateur()" class="w-full py-3 px-6 rounded-xl bg-slate-700 hover:bg-slate-800 text-slate-200 font-bold text-xs tracking-widest uppercase transition-all mt-6 cursor-pointer">Déconnexion</button>
      </div>
    </div>

    <!-- Menu Secondaire (Section Documents) -->
    <div class="menu" id="menuSecondaire" style="display: none;">
      <div class="text-center mb-6">
        <div class="w-16 h-16 rounded-full border border-blue-400/40 flex items-center justify-center bg-blue-500/10 mx-auto mb-3 overflow-hidden p-1">
            <img src="image.png" alt="Postes Canada" class="w-full h-full object-contain">
        </div>
        <span class="text-[10px] tracking-[0.25em] text-blue-400 uppercase font-semibold">Postes Canada</span>
        <h2 class="font-serif text-2xl sm:text-3xl font-bold text-white mt-1">Menu Secondaire</h2>
      </div>

      <div class="space-y-4">
        <!-- Bouton Directoires (Bleu) -->
        <button onclick="ouvrirDirectoire()" class="w-full py-4 px-6 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs tracking-widest uppercase shadow-lg shadow-blue-600/30 transition-all cursor-pointer">Directoires</button>
        
        <!-- Bouton Verification Casier (Indigo/Violet) -->
        <button onclick="location.href='casier 1.html'" class="w-full py-4 px-6 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs tracking-widest uppercase shadow-lg shadow-indigo-600/30 transition-all cursor-pointer">Verification Casier</button>
        
        <!-- Bouton Acceuil CQ (Teal/Cyan) -->
        <button onclick="location.href='controlcq.html'" class="w-full py-4 px-6 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs tracking-widest uppercase shadow-lg shadow-teal-600/30 transition-all cursor-pointer">Acceuil CQ</button>
        
        <!-- Bouton Observation SST (Ambre/Orange) -->
        <button onclick="window.open('https://forms.cloud.microsoft/pages/responsepage.aspx?id=dm0FdSi2iESCsICwi1LYVFoReUrH6Z1AvappVeIt-P5UNDdZRDk3WEFROVNSNEQ4TzBXNkhHR1ZTMi4u&route=shorturl', '_blank')" class="w-full py-4 px-6 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs tracking-widest uppercase shadow-lg shadow-amber-600/30 transition-all cursor-pointer">Observation SST</button>

        <!-- Nouveau Bouton Observation CQ (Rose/Fuchsia) -->
        <button onclick="location.href='CQ.html'" class="w-full py-4 px-6 rounded-xl bg-fuchsia-600 hover:bg-fuchsia-700 text-white font-bold text-xs tracking-widest uppercase shadow-lg shadow-fuchsia-600/30 transition-all cursor-pointer">Observation CQ</button>

        <!-- Bouton Retour (Gris foncé) -->
        <button onclick="retourMenu()" class="w-full py-3 px-6 rounded-xl bg-slate-700 hover:bg-slate-800 text-slate-200 font-bold text-xs tracking-widest uppercase transition-all mt-6 cursor-pointer">Retour</button>
      </div>
    </div>

  </div>

  <!-- SCRIPTS FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBksqM25AZOEPLmaOcbOHjORx78sGyGicc",
        authDomain: "postesst.firebaseapp.com",
        projectId: "postesst",
        storageBucket: "postesst.firebasestorage.app",
        messagingSenderId: "39362155503",
        appId: "1:39362155503:web:26b59f9eca20443c4c9c1a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Gestion de la soumission de connexion
    document.getElementById('formConnexion').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('emailConnexion').value;
        const password = document.getElementById('passwordConnexion').value;

        try {
            await signInWithEmailAndPassword(auth, email, password);
            document.getElementById('formConnexion').reset();
        } catch (error) {
            alert("Erreur de connexion : Identifiants incorrects.");
            console.error(error);
        }
    });

    // Gestion de la déconnexion globale
    window.deconnecterUtilisateur = async () => {
        try {
            await signOut(auth);
        } catch (error) {
            console.error("Erreur lors de la déconnexion :", error);
        }
    };

    // Vérification de l'état de l'authentification en temps réel
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // Utilisateur connecté : Afficher le menu principal et masquer le formulaire
            document.getElementById('vue-connexion').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
        } else {
            // Utilisateur déconnecté : Afficher le formulaire et masquer le menu
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('vue-connexion').classList.remove('hidden');
        }
    });
  </script>

  <script>
    function ouvrirMenuDocuments() {
      document.getElementById('menuPrincipal').style.display = 'none';
      document.getElementById('menuSecondaire').style.display = 'block';
    }

    function retourMenu() {
      document.getElementById('menuSecondaire').style.display = 'none';
      document.getElementById('menuPrincipal').style.display = 'block';
    }

    function ouvrirDirectoire() {
      const numero = prompt('Entrez le numéro de route :');
      if (numero && numero.trim() !== '') {
        const routeNettoyee = numero.trim();
        localStorage.setItem('numeroRoute', routeNettoyee);
        location.href = encodeURIComponent(routeNettoyee) + '.htm';
      }
    }
  </script>

</body>
</html>
