<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postes Canada — Benchmark & 15.08</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts : Cinzel & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
      body {
          background-color: #0d1b2a;
          color: #e0e0e0;
          font-family: 'Plus Jakarta Sans', sans-serif;
      }
      .card-border {
          border: 1px solid #415a77;
      }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-6">

  <div class="w-full max-w-3xl bg-[#1b263b] p-8 rounded-2xl card-border shadow-2xl my-6">
    <div class="text-center mb-6">
      <h1 class="font-serif text-2xl font-bold text-white">Gestion des Routes & Benchmark</h1>
      <span class="text-xs uppercase tracking-widest text-indigo-400 font-semibold" id="modeIndicator">Mode Standard</span>
    </div>

    <!-- Section des données de base (15.08 et BZ Route Régulière) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div class="bg-[#0d1b2a] p-4 rounded-xl card-border">
        <label class="block text-xs uppercase tracking-wider text-indigo-300 mb-2">Valeur 15.08</label>
        <input type="number" id="valeur1508" class="w-full px-4 py-2 rounded-lg bg-[#1b263b] text-white card-border focus:outline-none focus:border-indigo-500 text-sm" placeholder="Entrez la valeur 15.08" value="0">
      </div>
      <div class="bg-[#0d1b2a] p-4 rounded-xl card-border">
        <label class="block text-xs uppercase tracking-wider text-indigo-300 mb-2">BZ Route Régulière</label>
        <input type="number" id="valeurBZ" class="w-full px-4 py-2 rounded-lg bg-[#1b263b] text-white card-border focus:outline-none focus:border-indigo-500 text-sm" placeholder="Entrez la valeur BZ régulière" value="0">
      </div>
    </div>

    <!-- MODULE ACHEMINEUR (Visible uniquement en mode 'booker') -->
    <div id="moduleAchemineur" class="mb-6 p-5 bg-[#0d1b2a] rounded-xl card-border" style="display: none;">
      <h3 class="font-serif text-lg font-bold text-white mb-4 text-indigo-400">Module Achemineur (Ach1 à Ach11)</h3>
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
        <!-- Génération dynamique ou statique des routes Ach1 à Ach11 -->
        <script>
          for (let i = 1; i <= 11; i++) {
            document.write(`
              <div class="flex flex-col">
                <label class="text-[11px] text-gray-300 uppercase mb-1">Ach${i}</label>
                <input type="number" class="achemineur-input px-3 py-2 rounded-lg bg-[#1b263b] text-white card-border text-sm focus:outline-none focus:border-indigo-500" data-route="Ach${i}" value="0">
              </div>
            `);
          }
        </script>
      </div>
    </div>

    <!-- BOUTON SYNTHÈSE (Visible uniquement en mode 'booker') -->
    <div id="containerSynthese" class="mb-6" style="display: none;">
      <button id="btnSynthese" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs tracking-widest uppercase shadow-lg shadow-indigo-600/30 transition-all cursor-pointer">
        Générer la Synthèse
      </button>
    </div>

    <!-- RAPPORT DE SYNTHÈSE (Résultats) -->
    <div id="resultatSynthese" class="p-5 bg-[#0d1b2a] rounded-xl card-border mb-6" style="display: none;">
      <h3 class="font-serif text-lg font-bold text-white mb-3 text-indigo-300">Rapport de Synthèse Combiné</h3>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between border-b border-gray-700 pb-2">
          <span class="text-gray-300">Total 15.08 :</span>
          <span id="total1508" class="font-bold text-white">0</span>
        </div>
        <div class="flex justify-between border-b border-gray-700 pb-2">
          <span class="text-gray-300">Total BZ Route Régulière :</span>
          <span id="totalBZReguliere" class="font-bold text-white">0</span>
        </div>
        <div class="flex justify-between border-b border-gray-700 pb-2">
          <span class="text-gray-300">Total Routes Achemineur (Ach1 - Ach11) :</span>
          <span id="totalAchemineurs" class="font-bold text-white">0</span>
        </div>
        <div class="flex justify-between pt-2 text-base text-indigo-400 font-bold">
          <span>Total Général Combiné :</span>
          <span id="totalGeneral">0</span>
        </div>
      </div>
    </div>

    <!-- Bouton de retour vers le menu -->
    <button onclick="history.back()" class="w-full py-3 rounded-xl bg-slate-700 hover:bg-slate-800 text-slate-200 font-bold text-xs tracking-widest uppercase transition-all cursor-pointer">
      Retour
    </button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Vérifier si l'URL contient ?mode=booker
      const urlParams = new URLSearchParams(window.location.search);
      const isBookerMode = urlParams.get('mode') === 'booker';

      if (isBookerMode) {
        // Activer l'affichage du module Achemineur et du bouton Synthèse
        document.getElementById('moduleAchemineur').style.display = 'block';
        document.getElementById('containerSynthese').style.display = 'block';
        document.getElementById('modeIndicator').textContent = "Mode Booker • Actif";
        document.getElementById('modeIndicator').className = "text-xs uppercase tracking-widest text-emerald-400 font-semibold";
      }

      // Logique de calcul du bouton Synthèse
      const btnSynthese = document.getElementById('btnSynthese');
      if (btnSynthese) {
        btnSynthese.addEventListener('click', function() {
          // 1. Récupérer la valeur 15.08
          let val1508 = parseFloat(document.getElementById('valeur1508').value) || 0;

          // 2. Récupérer la valeur BZ route régulière
          let valBZ = parseFloat(document.getElementById('valeurBZ').value) || 0;

          // 3. Calculer la somme de toutes les routes achemineur (Ach1 à Ach11)
          let totalAch = 0;
          const inputsAch = document.querySelectorAll('.achemineur-input');
          inputsAch.forEach(input => {
            totalAch += parseFloat(input.value) || 0;
          });

          // 4. Mettre à jour l'affichage des totaux
          document.getElementById('total1508').textContent = val1508.toFixed(2);
          document.getElementById('totalBZReguliere').textContent = valBZ.toFixed(2);
          document.getElementById('totalAchemineurs').textContent = totalAch.toFixed(2);
          document.getElementById('totalGeneral').textContent = (val1508 + valBZ + totalAch).toFixed(2);

          // Afficher le bloc des résultats de synthèse
          document.getElementById('resultatSynthese').style.display = 'block';
        });
      }
    });
  </script>

</body>
</html>
