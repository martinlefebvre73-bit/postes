<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recherche Dépôt Postes</title>

<style>
body{
    font-family:Arial, sans-serif;
    max-width:1000px;
    margin:40px auto;
    padding:20px;
}

h1{
    color:#004990;
}

input{
    width:70%;
    padding:10px;
    font-size:16px;
}

button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
    background:#004990;
    color:white;
    border:none;
}

button:hover{
    background:#0066cc;
}

.result{
    border:1px solid #ccc;
    padding:10px;
    margin:10px 0;
    border-radius:5px;
}

.result a{
    color:#004990;
    text-decoration:none;
    font-weight:bold;
}

.result a:hover{
    text-decoration:underline;
}

#results{
    margin-top:20px;
}
</style>
</head>

<body>

<h1>Recherche dans le dépôt Postes</h1>

<input type="text"
       id="search"
       placeholder="BLP, adresse ou ramassage">

<button onclick="rechercher()">Rechercher</button>

<div id="results"></div>

<script>

const USER = "martinlefebvre73-bit";
const REPO = "postes";

async function getAllFiles(path = "") {

    const api =
        `https://api.github.com/repos/${USER}/${REPO}/contents/${path}`;

    const response = await fetch(api);

    if (!response.ok) {
        throw new Error("Impossible d'accéder au dépôt GitHub");
    }

    const data = await response.json();

    let files = [];

    for (const item of data) {

        if (
            item.type === "file" &&
            item.name.toLowerCase().endsWith(".html") &&
            item.name.toLowerCase() !== "recherche.html"
        ) {
            files.push(item.download_url);
        }

        if (item.type === "dir") {
            const subFiles = await getAllFiles(item.path);
            files = files.concat(subFiles);
        }
    }

    return files;
}

async function rechercher() {

    const terme =
        document.getElementById("search")
                .value
                .trim()
                .toLowerCase();

    if (!terme) {
        alert("Entrez un BLP, une adresse ou un ramassage.");
        return;
    }

    const results = document.getElementById("results");

    results.innerHTML =
        "<p>Recherche en cours...</p>";

    let html = "";
    let nb = 0;

    try {

        const fichiers = await getAllFiles();

        for (const fichier of fichiers) {

            try {

                const contenu =
                    await fetch(fichier)
                    .then(r => r.text());

                if (contenu.toLowerCase().includes(terme)) {

                    nb++;

                    html += `
                    <div class="result">
                        ✅ Trouvé dans :
                        ${fichier}
                            ${fichier}
                        </a>
                    </div>`;
                }

            } catch (e) {
                console.error(e);
            }
        }

        if (nb === 0) {
            html = "<p>Aucun résultat trouvé.</p>";
        }

        results.innerHTML =
            `<p><strong>${nb} résultat(s)</strong></p>` + html;

    } catch (e) {

        results.innerHTML =
            "<p>Erreur lors de l'accès au dépôt GitHub.</p>";

        console.error(e);
    }
}

document.getElementById("search")
.addEventListener("keypress", function(e){

    if(e.key === "Enter"){
        rechercher();
    }

});

</script>

</body>
</html>
