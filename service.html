<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapport du chauffeur sur les défauts du véhicule — Postes Canada</title>
  <!-- Feuille de style personnalisée -->
  <link rel="stylesheet" href="style6.css">
  <!-- html2pdf.js pour la génération du PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <!-- Barre d'outils supérieure (Navigation, Recherche, Enregistrement, Expédition & Impression) -->
  <div class="toolbar no-print">
    <button onclick="window.location.href='index.html'" class="btn btn-secondary">
      ← Retour au menu
    </button>
    
    <div class="toolbar-actions">
      <!-- Bouton Recherche -->
      <button id="btnRecherche" type="button" class="btn btn-search">
        <span>🔍</span>
        <span>Rechercher</span>
      </button>

      <!-- Bouton Enregistrer -->
      <button id="btnEnregistrer" type="button" class="btn btn-save">
        <span>💾</span>
        <span>Enregistrer dans Firebase</span>
      </button>

      <!-- Bouton Expédier par Courriel -->
      <button id="btnExpedier" type="button" class="btn btn-email">
        <span>📧</span>
        <span>Expédier</span>
      </button>

      <!-- Bouton Impression / PDF -->
      <button onclick="window.print()" class="btn btn-print">
        Imprimer / PDF
      </button>
    </div>
  </div>

  <!-- Conteneur Formulaire -->
  <div id="formulaireContent" class="page-container">
    
    <!-- En-tête : Logo & Titre -->
    <div class="header-section">
      <div class="logo-block">
        <div class="logo-text border-right">
          CANADA<br>POST
        </div>
        <div class="logo-text">
          POSTES<br>CANADA
        </div>
      </div>
      <div class="title-block">
        <h1>Driver's Vehicle Defect Report</h1>
        <h2>Rapport du chauffeur sur les défauts du véhicule</h2>
      </div>
    </div>

    <!-- Ligne 1 : Info Véhicule -->
    <div class="vehicle-info-grid">
      <!-- N° du véhicule avec Dictée Vocale -->
      <div class="field-group">
        <label class="field-label">Vehicle no. / N° du véhicule</label>
        <div class="input-with-icon">
          <input type="text" id="numVehicule" placeholder="Ex: 7299" class="input-line">
          <button type="button" onclick="activerDictee('numVehicule', this)" class="no-print btn-mic" title="Dictée vocale">
            🎙️
          </button>
        </div>
      </div>

      <!-- Local du chauffeur / Dépôt avec Dictée Vocale -->
      <div class="field-group">
        <label class="field-label">Driver's location / Local du chauffeur (Dépôt)</label>
        <div class="input-with-icon">
          <input type="text" id="depotChauffeur" value="Dépôt aéroport" placeholder="Ex: Aéroport" class="input-line">
          <button type="button" onclick="activerDictee('depotChauffeur', this)" class="no-print btn-mic" title="Dictée vocale">
            🎙️
          </button>
        </div>
      </div>

      <!-- Indication du compteur -->
      <div class="field-group">
        <label class="field-label">Odometer reading / Indication du compteur</label>
        <input type="text" id="odometerReading" placeholder="Ex: 124500" class="input-line">
      </div>
    </div>

    <!-- Section Principale : Exposé du problème / Réparation effectuée -->
    <div class="main-sections-grid">
      <!-- Colonne Gauche: Exposé du problème (Description avec Dictée Vocale) -->
      <div class="defect-column">
        <div>
          <div class="section-header-row">
            <label class="field-label-bold">
              Details of vehicle defect(s) / Exposé du problème du véhicule
            </label>
            <button type="button" onclick="activerDictee('descriptionDefaut', this)" class="no-print btn-dicter" title="Dictée vocale">
              <span>🎙️</span>
              <span>Dicter</span>
            </button>
          </div>
          <textarea id="descriptionDefaut" class="textarea-field" placeholder="Saisir ou dicter les détails du problème..."></textarea>
        </div>
      </div>

      <!-- Colonne Droite: Réparation effectuée -->
      <div class="repair-column">
        <div>
          <label class="field-label-bold border-bottom pb-1 mb-2 block">
            Repair(s) completed / Réparation effectuée
          </label>
          <textarea id="reparationEffectuee" class="textarea-field" placeholder="Réservé au service de mécanique..."></textarea>
        </div>
      </div>
    </div>

    <!-- Certifications / Signatures Chauffeur & Mécanicien -->
    <div class="certification-box">
      <div class="checkbox-row">
        <input type="checkbox" id="certify" class="checkbox-input">
        <label for="certify" class="checkbox-label">
          I certify that all defects have been corrected and communicated. / J'atteste que toutes les anomalies ont été corrigées et signalées.
        </label>
      </div>

      <!-- Signatures Grid -->
      <div class="signatures-grid">
        <!-- Chauffeur -->
        <div class="signature-col">
          <div>
            <label class="signature-label">Driver's Name / Nom du conducteur</label>
            <input type="text" id="driverName" class="input-line">
          </div>
          <div>
            <label class="signature-label">Driver's signature / Signature du chauffeur</label>
            <div class="signature-line-box"></div>
          </div>
          <div class="time-date-row">
            <div class="half-width">
              <label class="sub-label">Time / Heure</label>
              <input type="text" id="driverTime" placeholder="--:--" class="input-line text-center">
            </div>
            <div class="half-width">
              <label class="sub-label">Date (AA/MM/JJ)</label>
              <input type="text" id="driverDate" class="champ-date-aujourdhui input-line text-center">
            </div>
          </div>
        </div>

        <!-- Mécanicien -->
        <div class="signature-col border-x">
          <div>
            <label class="signature-label">Mechanic's or supervisor's name / Nom du mécanicien</label>
            <input type="text" id="mechanicName" class="input-line">
          </div>
          <div>
            <label class="signature-label">Mechanic's signature / Signature du mécanicien</label>
            <div class="signature-line-box"></div>
          </div>
          <div class="time-date-row">
            <div class="half-width">
              <label class="sub-label">Time / Heure</label>
              <input type="text" id="mechanicTime" placeholder="--:--" class="input-line text-center">
            </div>
            <div class="half-width">
              <label class="sub-label">Date (AA/MM/JJ)</label>
              <input type="text" id="mechanicDate" class="input-line text-center" placeholder="AA/MM/JJ">
            </div>
          </div>
        </div>

        <!-- Surveillant -->
        <div class="signature-col">
          <div>
            <label class="signature-label">Supervisor's Name / Nom du surveillant</label>
            <select id="supervisorName" class="select-line">
              <option value="Martin Lefebvre" selected>Martin Lefebvre</option>
              <option value="Pierre-Stephane Moreau">Pierre-Stephane Moreau</option>
              <option value="Jonathan Foucreault">Jonathan Foucreault</option>
              <option value="Edgar Raigosa">Edgar Raigosa</option>
              <option value="Jean Petit">Jean Petit</option>
              <option value="Yanick Dussault">Yanick Dussault</option>
              <option value="Yves Moukoue">Yves Moukoue</option>
              <option value="Arianne Lavigueur">Arianne Lavigueur</option>
            </select>
          </div>
          <div>
            <label class="signature-label">Supervisor's signature / Signature du surveillant</label>
            <div class="signature-line-box"></div>
          </div>
          <div class="time-date-row">
            <div class="half-width">
              <label class="sub-label">Time / Heure</label>
              <input type="text" id="supervisorTime" placeholder="--:--" class="input-line text-center">
            </div>
            <div class="half-width">
              <label class="sub-label">Date (AA/MM/JJ)</label>
              <input type="text" id="supervisorDate" class="champ-date-aujourdhui input-line text-center font-bold">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Avertissement & Pied de page -->
    <div class="footer-warning-box">
      <div class="checkbox-row">
        <input type="checkbox" id="returned" class="checkbox-input">
        <label for="returned" class="checkbox-label-small">
          Completed DVDR must be returned with vehicle / Le Rapport du chauffeur sur les défauts du véhicule dûment rempli doit être retourné avec le véhicule[cite: 1]
        </label>
      </div>
      <div class="form-code">
        34-093-200 (17-02)[cite: 2]
      </div>
    </div>

    <!-- Copies Destinataires -->
    <div class="copies-footer">
      <span>1. Service Centre / Centre du service</span>
      <span>2. Driver / Chauffeur</span>
      <span>3. Operations / Opérations</span>
    </div>

  </div>

  <!-- SCRIPT FIREBASE JS SDK (MODULE) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, orderBy, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD11KHhTufTrL0eGBKGWglghoArZhca3OI",
      authDomain: "postes-26884.firebaseapp.com",
      projectId: "postes-26884",
      storageBucket: "postes-26884.firebasestorage.app",
      messagingSenderId: "75974397689",
      appId: "1:75974397689:web:5fd12942788612c62b1c28",
      measurementId: "G-83YPF62ET5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Enregistrement
    document.getElementById('btnEnregistrer').addEventListener('click', async () => {
      const btn = document.getElementById('btnEnregistrer');
      btn.disabled = true;
      btn.innerText = "Enregistrement...";

      try {
        const donneesCamion = {
          numVehicule: document.getElementById('numVehicule').value,
          depotChauffeur: document.getElementById('depotChauffeur').value,
          odometerReading: document.getElementById('odometerReading').value,
          descriptionDefaut: document.getElementById('descriptionDefaut').value,
          reparationEffectuee: document.getElementById('reparationEffectuee').value,
          certifieCorrection: document.getElementById('certify').checked,
          driverName: document.getElementById('driverName').value,
          driverTime: document.getElementById('driverTime').value,
          driverDate: document.getElementById('driverDate').value,
          mechanicName: document.getElementById('mechanicName').value,
          mechanicTime: document.getElementById('mechanicTime').value,
          mechanicDate: document.getElementById('mechanicDate').value,
          supervisorName: document.getElementById('supervisorName').value,
          supervisorTime: document.getElementById('supervisorTime').value,
          supervisorDate: document.getElementById('supervisorDate').value,
          formulaireRetourne: document.getElementById('returned').checked,
          creeLe: serverTimestamp()
        };

        const docRef = await addDoc(collection(db, "camion"), donneesCamion);
        alert("Rapport enregistré avec succès dans Firebase ! ID : " + docRef.id);
      } catch (error) {
        console.error("Erreur d'enregistrement Firebase :", error);
        alert("Erreur lors de l'enregistrement : " + error.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = "<span>💾</span><span>Enregistrer dans Firebase</span>";
      }
    });

    // Recherche
    document.getElementById('btnRecherche').addEventListener('click', async () => {
      const numRecherche = prompt("Entrez le numéro du camion à rechercher (ex: 7299) :");
      if (!numRecherche || numRecherche.trim() === '') return;

      const btn = document.getElementById('btnRecherche');
      btn.disabled = true;
      btn.innerText = "Recherche...";

      try {
        const camionRef = collection(db, "camion");
        const q = query(camionRef, where("numVehicule", "==", numRecherche.trim()), orderBy("creeLe", "desc"));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          alert(`Aucune fiche trouvée pour le camion N° ${numRecherche.trim()}.`);
        } else {
          const docData = querySnapshot.docs[0].data();

          document.getElementById('numVehicule').value = docData.numVehicule || '';
          document.getElementById('depotChauffeur').value = docData.depotChauffeur || '';
          document.getElementById('odometerReading').value = docData.odometerReading || '';
          document.getElementById('descriptionDefaut').value = docData.descriptionDefaut || '';
          document.getElementById('reparationEffectuee').value = docData.reparationEffectuee || '';
          document.getElementById('certify').checked = !!docData.certifieCorrection;
          document.getElementById('driverName').value = docData.driverName || '';
          document.getElementById('driverTime').value = docData.driverTime || '';
          document.getElementById('driverDate').value = docData.driverDate || '';
          document.getElementById('mechanicName').value = docData.mechanicName || '';
          document.getElementById('mechanicTime').value = docData.mechanicTime || '';
          document.getElementById('mechanicDate').value = docData.mechanicDate || '';
          document.getElementById('supervisorName').value = docData.supervisorName || 'Martin Lefebvre';
          document.getElementById('supervisorTime').value = docData.supervisorTime || '';
          document.getElementById('supervisorDate').value = docData.supervisorDate || '';
          document.getElementById('returned').checked = !!docData.formulaireRetourne;

          alert(`Fiche du camion N° ${numRecherche.trim()} chargée avec succès !`);
        }
      } catch (error) {
        console.error("Erreur de recherche Firebase :", error);
        alert("Erreur lors de la recherche : " + error.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = "<span>🔍</span><span>Rechercher</span>";
      }
    });

    // Bouton Expédier
    document.getElementById('btnExpedier').addEventListener('click', async () => {
      const btn = document.getElementById('btnExpedier');
      btn.disabled = true;
      btn.innerText = "Génération PDF...";

      const element = document.getElementById('formulaireContent');
      const numCamion = document.getElementById('numVehicule').value || 'Inconnu';
      const nomFichier = `Rapport_Defaut_Camion_${numCamion}.pdf`;

      const opt = {
        margin: 5,
        filename: nomFichier,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
      };

      try {
        await html2pdf().set(opt).from(element).save();

        const emailDestinataire = "Garage.Prefontaine@canadapost.postescanada.ca";
        const sujet = encodeURIComponent(`Rapport de défaut de véhicule - Camion #${numCamion}`);
        const corps = encodeURIComponent(`Bonjour,\n\nVeuillez trouver ci-joint le rapport de défaut concernant le camion #${numCamion}.\n\n(Note: Si le PDF téléchargé ne s'est pas joint automatiquement, veuillez glisser le fichier "${nomFichier}" dans ce courriel).\n\nMerci,\nMartin Lefebvre`);

        window.location.href = `mailto:${emailDestinataire}?subject=${sujet}&body=${corps}`;
      } catch (err) {
        console.error("Erreur lors de l'export PDF :", err);
        alert("Erreur lors de la génération du fichier PDF.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = "<span>📧</span><span>Expédier</span>";
      }
    });
  </script>

  <!-- Script JS utilitaire : Date automatique & Dictée Vocale -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const aujourdhui = new Date();
      const annee = aujourdhui.getFullYear();
      const mois = String(aujourdhui.getMonth() + 1).padStart(2, '0');
      const jour = String(aujourdhui.getDate()).padStart(2, '0');
      
      const dateFormatee = `${annee}/${mois}/${jour}`;

      const champsDate = document.querySelectorAll('.champ-date-aujourdhui');
      champsDate.forEach(input => {
        input.value = dateFormatee;
      });
    });

    // Dictée vocale
    function activerDictee(idElement, bouton) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        alert("La dictée vocale n'est pas supportée par votre navigateur.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'fr-CA';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      const champCible = document.getElementById(idElement);

      recognition.onstart = () => {
        bouton.classList.add('pulse-anim');
        champCible.placeholder = "Écoute en cours...";
      };

      recognition.onresult = (event) => {
        const texteDicte = event.results[0][0].transcript;
        if (champCible.value.trim() === '') {
          champCible.value = texteDicte;
        } else {
          champCible.value += ' ' + texteDicte;
        }
      };

      recognition.onerror = (event) => {
        console.error("Erreur de dictée vocale :", event.error);
        alert("Erreur lors de la capture vocale : " + event.error);
      };

      recognition.onend = () => {
        bouton.classList.remove('pulse-anim');
        if (champCible.tagName === 'TEXTAREA') {
          champCible.placeholder = "Saisir ou dicter les détails du problème...";
        } else {
          champCible.placeholder = "";
        }
      };

      recognition.start();
    }
  </script>

</body>
</html>
