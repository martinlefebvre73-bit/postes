<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Principal</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px;
    background-color: #f5f5f5;
}

.card {
    background: #ffffff;
    max-width: 400px;
    margin: 0 auto;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

h1, h2 {
    color: #333;
}

.menu {
    margin-top: 20px;
}

button {
    display: block;
    width: 100%;
    margin: 12px 0;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background-color: #0056b3;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.2s ease;
}

button:hover {
    background-color: #003d82;
}

button.btn-danger {
    background-color: #d32f2f;
}

button.btn-danger:hover {
    background-color: #b71c1c;
}

button.btn-secondary {
    background-color: #6c757d;
}

button.btn-secondary:hover {
    background-color: #545b62;
}

#menuSecondaire {
    display: none;
}
</style>
</head>

<body>

<div class="card">

    <div class="menu" id="menuPrincipal">
        <h1>Menu principal</h1>

        <button onclick="location.href='casier 1asier
        </button>

        <button onclick="ouvrirDirectoire()">
            Directoire
        </button>
    </div>

    <div class="menu" id="menuSecondaire">
        <h2>Menu secondaire</h2>

        <button onclick="ouvrirRoute()">Route</button>

        <button e.html
            Recherche
        </button>

        <button class="          Problème de livraison
        </button>

        <button class="btn-secondary" onclick="retourMenu()">
            Retour
        </button>
    </div>

</div>

<script>
function ouvrirDirectoire() {
    document.getElementById('menuPrincipal').style.display = 'none';
    document.getElementById('menuSecondaire').style.display = 'block';
}

function retourMenu() {
    document.getElementById('menuSecondaire').style.display = 'none';
    document.getElementById('menuPrincipal').style.display = 'block';
}

function ouvrirRoute() {
    const numero = prompt('Entrez le numéro de route :');

    if (numero && numero.trim() !== '') {
        location.href = encodeURIComponent(numero.trim()) + '.html';
    }
}
</script>

</body>
</html>
