<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recherche BLP - Adresse - Ramassage</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width:1200px;
    margin:20px auto;
    padding:20px;
    background:#f5f5f5;
}

h1{
    color:#004990;
}

.recherche{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

input{
    flex:1;
    padding:12px;
    font-size:16px;
}

button{
    padding:12px 20px;
    background:#004990;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#0066cc;
}

.resultat{
    background:white;
    border-left:5px solid #004990;
    margin-bottom:15px;
    padding:15px;
    border-radius:5px;
}

.fichier{
    font-weight:bold;
    color:#004990;
}

.extrait{
    margin-top:10px;
    white-space:pre-wrap;
    color:#333;
}

.stats{
    margin-bottom:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>Recherche BLP / Adresse / Ramassage</h1>

<div class="recherche">
    <input type="text" id="terme" placeholder="Entrez un BLP, une adresse ou un ramassage">
    <button onclick="rechercher()">Rechercher</button>
</div>

<div class="stats" id="stats"></div>
<div id="resultats"></div>

<script>

// AJOUTER ICI TOUS VOS FICHIERS HTML
const pages = [
    "index.html"
    // "blp.html",
    // "ramassage.html",
    // "boucherville.html",
    // etc.
];

async function rechercher() {

    const terme = document.getElementById("terme").value.trim().toLowerCase();

    if(!terme){
        alert("Veuillez saisir un terme.");
        return;
    }

    const resultats = document.getElementById("resultats");
    const stats = document.getElementById("stats");

    resultats.innerHTML = "";
    stats.innerHTML = "Recherche en cours...";

    let nbTrouves = 0;

    for(const page of pages){

        try{

            const response = await fetch(page);

            if(!response.ok){
                continue;
            }

            const contenu = await response.text();
            const contenuMin = contenu.toLowerCase();

            const position = contenuMin.indexOf(terme);

            if(position !== -1){

                nbTrouves++;

                const debut = Math.max(0, position - 100);
                const fin = Math.min(contenu.length, position + 250);

                const extrait = contenu.substring(debut, fin)
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");

                resultats.innerHTML += `
                    <div class="resultat">

                        <div class="fichier">
                            Trouvé dans :
                            ${page}${page}</a>
                        </div>

                        <div class="extrait">
${extrait}
                        </div>

                    </div>
                `;
            }

        } catch(e){
            console.error(page, e);
        }
    }

    if(nbTrouves === 0){
        stats.innerHTML = "Aucun résultat trouvé.";
    } else {
        stats.innerHTML = nbTrouves + " résultat(s) trouvé(s).";
    }
}

document.getElementById("terme").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        rechercher();
    }
});
</script>

</body>
</html>
