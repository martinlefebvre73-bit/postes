<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi des Interventions - Professionnel</title>
    <!-- Bootstrap CSS pour l'interface -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d1b2a; /* Fond bleu foncé professionnel */
            color: #e0e1dd;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card, .modal-content {
            background-color: #1b263b;
            color: #e0e1dd;
            border: 1px solid #415a77;
        }
        .form-control, .form-select {
            background-color: #0d1b2a;
            color: #e0e1dd;
            border: 1px solid #415a77;
        }
        .form-control:focus, .form-select:focus {
            background-color: #1b263b;
            color: #ffffff;
            border-color: #778da9;
            box-shadow: 0 0 0 0.25rem rgba(119, 141, 169, 0.25);
        }
        .table {
            color: #e0e1dd;
        }
        .table-striped > tbody > tr:nth-of-type(odd) {
            background-color: rgba(255, 255, 255, 0.05);
            color: #e0e1dd;
        }
        .table-bordered {
            border-color: #415a77;
        }
        .table-bordered td, .table-bordered th {
            border-color: #415a77;
        }
        /* Style pour des boutons de grandeur égale */
        .btn-menu-egal {
            flex: 1;
            min-width: 220px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
        }
    </style>
</head>
<body onload="initialiserDonnees()">

    <div class="container my-5">
        <h1 class="text-center mb-5 text-white fw-bold">Tableau de Bord - Suivi des Interventions</h1>

        <!-- PAGE D'ACCUEIL -->
        <div id="vue-accueil">
            
            <!-- TABLEAU DES STATISTIQUES (KPIs) -->
            <div class="card shadow-lg p-4 mb-4">
                <h4 class="text-light mb-3 text-center">État Global du Suivi</h4>
                <div class="table-responsive">
                    <table class="table table-bordered text-center align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="py-3 fs-5">Cas Ouverts</th>
                                <th class="py-3 fs-5">Cas en Retard</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="py-4 fs-3 fw-bold text-info" id="kpi-ouverts">Chargement...</td>
                                <td class="py-4 fs-3 fw-bold text-danger" id="kpi-retard">Chargement...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- BOUTONS DE NAVIGATION DE GRANDEUR ÉGALE -->
            <div class="card shadow-lg p-4 text-center">
                <div class="d-flex justify-content-center gap-3 flex-wrap">
                    <button class="btn btn-primary btn-menu-egal" onclick="afficherPageSaisie()">Saisie intervention</button>
                    <button class="btn btn-warning btn-menu-egal text-dark" onclick="afficherRetards()">Retard</button>
                    <button class="btn btn-info btn-menu-egal text-dark" onclick="ouvrirModalRecherche()">Recherche</button>
                </div>
            </div>

            <!-- ZONE D'AFFICHAGE DYNAMIQUE (Pour les Retards ou la Recherche) -->
            <div id="zone-affichage" class="card shadow-sm p-4 mt-4 d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 id="titre-zone" class="m-0"></h3>
                    <button class="btn btn-outline-light btn-sm" onclick="retourAccueil()">Fermer / Retour</button>
                </div>
                <div id="contenu-zone"></div>
            </div>
        </div>

        <!-- VUE PAGE COMPLÈTE : SAISIE INTERVENTION -->
        <div id="vue-saisie" class="card shadow-lg p-5 d-none">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="text-light">Nouvelle Intervention</h2>
                <button class="btn btn-outline-light" onclick="retourAccueil()">← Retour au menu</button>
            </div>
            
            <form id="formIntervention">
                <div class="row">
                    <!-- Date -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Date de l'intervention</label>
                        <input type="date" class="form-control" id="dateIntervention" required>
                    </div>
                    <!-- Sélection de l'employé (Nom & Prénom) -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Employé (Nom, Prénom)</label>
                        <select class="form-select" id="nomEmploye" required onchange="remplirInfosEmploye(this)">
                            <option value="">-- Chargement des employés --</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <!-- ID (Rempli automatiquement) -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">ID de l'employé</label>
                        <input type="text" class="form-control" id="idEmploye" readonly required placeholder="Sélectionnez un employé">
                    </div>
                    <!-- Ancienneté -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Ancienneté</label>
                        <input type="text" class="form-control" id="ancienneteEmploye" readonly placeholder="Ancienneté">
                    </div>
                </div>

                <!-- Description avec Dictée Vocale -->
                <div class="mb-3">
                    <label class="form-label">Description (Dictée vocale possible)</label>
                    <div class="input-group">
                        <textarea class="form-control" id="description" rows="4" placeholder="Cliquez sur le micro pour dicter..."></textarea>
                        <button type="button" class="btn btn-outline-light" onclick="demarrerDictee()">🎤 Dicter</button>
                    </div>
                </div>

                <div class="row">
                    <!-- Prochain rendez-vous -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Prochain rendez-vous</label>
                        <select class="form-select" id="prochainRdv" required>
                            <option value="14">2 semaines</option>
                            <option value="28">4 semaines</option>
                        </select>
                    </div>
                    <!-- Superviseur responsable -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Superviseur responsable</label>
                        <select class="form-select" id="superviseur" required>
                            <option value="">-- Chargement des superviseurs --</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex gap-3 mt-4">
                    <button type="submit" class="btn btn-success btn-lg flex-grow-1">Enregistrer l'intervention</button>
                    <button type="button" class="btn btn-secondary btn-lg" onclick="retourAccueil()">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL : RECHERCHE -->
    <div class="modal fade" id="modalRecherche" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-light">Rechercher les interventions d'un employé</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nom ou ID de l'employé</label>
                        <input type="text" class="form-control" id="critereRecherche" placeholder="Entrez le nom ou l'ID">
                    </div>
                    <button type="button" class="btn btn-info w-100 text-dark fw-bold" onclick="executerRecherche()">Rechercher</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBksqM25AZOEPLmaOcbOHjORx78sGyGicc",
            authDomain: "postesst.firebaseapp.com",
            projectId: "postesst",
            storageBucket: "postesst.firebasestorage.app",
            messagingSenderId: "39362155503",
            appId: "1:39362155503:web:26b59f9eca20443c4c9c1a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- GESTION DES VUES ---
        window.afficherPageSaisie = () => {
            document.getElementById('vue-accueil').classList.add('d-none');
            document.getElementById('vue-saisie').classList.remove('d-none');
            document.getElementById('dateIntervention').valueAsDate = new Date();
        };

        window.retourAccueil = () => {
            document.getElementById('vue-saisie').classList.add('d-none');
            document.getElementById('zone-affichage').classList.add('d-none');
            document.getElementById('vue-accueil').classList.remove('d-none');
            chargerStatistiques(); // Rafraîchir les stats au retour
        };

        window.ouvrirModalRecherche = () => new bootstrap.Modal(document.getElementById('modalRecherche')).show();

        // --- CHARGEMENT INITIAL DES DONNÉES ET STATISTIQUES ---
        window.initialiserDonnees = async () => {
            await chargerStatistiques();
            await chargerEmployes();
            await chargerSuperviseurs();
        };

        // Calcul et affichage du nombre de cas ouverts et en retard
        window.chargerStatistiques = async () => {
            try {
                const querySnapshot = await getDocs(collection(db, "interventions"));
                let ouverts = 0;
                let enRetard = 0;
                const aujourdHui = new Date().toISOString().split('T')[0];

                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    if (data.statut === "Ouvert") {
                        ouverts++;
                        if (data.dateEcheance < aujourdHui) {
                            enRetard++;
                        }
                    }
                });

                document.getElementById('kpi-ouverts').textContent = ouverts;
                document.getElementById('kpi-retard').textContent = enRetard;
            } catch (e) {
                console.error("Erreur lors du calcul des statistiques :", e);
                document.getElementById('kpi-ouverts').textContent = "Erreur";
                document.getElementById('kpi-retard').textContent = "Erreur";
            }
        };

        window.chargerEmployes = async () => {
            const selectEmp = document.getElementById('nomEmploye');
            try {
                const querySnapshot = await getDocs(collection(db, "employes"));
                selectEmp.innerHTML = '<option value="">-- Choisir un employé --</option>';
                querySnapshot.forEach((doc) => {
                    let emp = doc.data();
                    let option = document.createElement('option');
                    let nomComplet = `${emp.nom || ''} ${emp.prenom || ''}`.trim();
                    let employeId = emp.idEmploye !== undefined ? emp.idEmploye : (emp.id !== undefined ? emp.id : '');
                    
                    option.value = nomComplet; 
                    option.dataset.id = employeId; 
                    option.dataset.anciennete = emp.anciennete || 'Non spécifiée';
                    
                    option.textContent = `${emp.nom || ''}, ${emp.prenom || ''} (ID: ${employeId})`;
                    selectEmp.appendChild(option);
                });
            } catch (e) {
                console.error("Erreur chargement employés: ", e);
            }
        };

        window.remplirInfosEmploye = (selectElement) => {
            const selectedOption = selectElement.options[selectElement.selectedIndex];
            document.getElementById('idEmploye').value = selectedOption.dataset.id || '';
            document.getElementById('ancienneteEmploye').value = selectedOption.dataset.anciennete || '';
        };

        window.chargerSuperviseurs = async () => {
            const selectSup = document.getElementById('superviseur');
            try {
                const querySnapshot = await getDocs(collection(db, "superviseurs"));
                selectSup.innerHTML = '<option value="">-- Choisir un superviseur --</option>';
                querySnapshot.forEach((doc) => {
                    let sup = doc.data();
                    let option = document.createElement('option');
                    option.value = sup.courriel || sup.email || ''; 
                    option.textContent = `${sup.nom || 'Sans nom'} (${sup.courriel || sup.email || ''})`;
                    selectSup.appendChild(option);
                });
            } catch (e) {
                console.error("Erreur chargement superviseurs: ", e);
            }
        };

        // --- DICTÉE VOCALE ---
        window.demarrerDictee = () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("La dictée vocale n'est pas supportée par votre navigateur.");
                return;
            }
            const reconnaissance = new SpeechRecognition();
            reconnaissance.lang = 'fr-FR';
            reconnaissance.onresult = (event) => {
                document.getElementById('description').value += " " + event.results[0][0].transcript;
            };
            reconnaissance.start();
        };

        // --- ENREGISTREMENT ---
        document.getElementById('formIntervention').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dateStr = document.getElementById('dateIntervention').value;
            const delaiJours = parseInt(document.getElementById('prochainRdv').value);
            
            let dateEcheance = new Date(dateStr);
            dateEcheance.setDate(dateEcheance.getDate() + delaiJours);

            const selectEmp = document.getElementById('nomEmploye');
            const selectedOption = selectEmp.options[selectEmp.selectedIndex];

            const nouvelleIntervention = {
                date: dateStr,
                nom: selectedOption.value,
                idEmploye: document.getElementById('idEmploye').value,
                anciennete: document.getElementById('ancienneteEmploye').value,
                description: document.getElementById('description').value,
                prochainRdvJours: delaiJours,
                dateEcheance: dateEcheance.toISOString().split('T')[0],
                superviseurEmail: document.getElementById('superviseur').value,
                statut: "Ouvert"
            };

            try {
                await addDoc(collection(db, "interventions"), nouvelleIntervention);
                alert("Intervention enregistrée avec succès !");
                document.getElementById('formIntervention').reset();
                retourAccueil();
            } catch (erreur) {
                console.error("Erreur : ", erreur);
                alert("Erreur lors de l'enregistrement.");
            }
        });

        // --- RETARDS ET COURRIEL ---
        window.afficherRetards = async () => {
            const zone = document.getElementById('zone-affichage');
            const titre = document.getElementById('titre-zone');
            const contenu = document.getElementById('contenu-zone');
            
            zone.classList.remove('d-none');
            titre.textContent = "Liste des suivis en retard";
            contenu.innerHTML = "<p>Chargement...</p>";

            const aujourdHui = new Date().toISOString().split('T')[0];
            const q = query(collection(db, "interventions"), where("dateEcheance", "<", aujourdHui), where("statut", "==", "Ouvert"));
            
            const querySnapshot = await getDocs(q);
            let html = `<div class="table-responsive"><table class="table table-striped table-bordered"><thead><tr><th>Date</th><th>Employé</th><th>ID</th><th>Ancienneté</th><th>Échéance</th><th>Superviseur (Courriel)</th></tr></thead><tbody>`;
            
            let retardsParSuperviseur = {};

            querySnapshot.forEach((doc) => {
                let data = doc.data();
                let supEmail = data.superviseurEmail || "non-assigne@entreprise.com";
                let ancienneteTxt = data.anciennete || 'N/A';
                
                html += `<tr><td>${data.date}</td><td>${data.nom}</td><td>${data.idEmploye}</td><td>${ancienneteTxt}</td><td class="text-danger fw-bold">${data.dateEcheance}</td><td>${supEmail}</td></tr>`;
                
                if (!retardsParSuperviseur[supEmail]) {
                    retardsParSuperviseur[supEmail] = "";
                }
                retardsParSuperviseur[supEmail] += `- Employé : ${data.nom} (ID: ${data.idEmploye}, Ancienneté: ${ancienneteTxt}), Échéance dépassée le : ${data.dateEcheance}%0A`;
            });

            html += `</tbody></table></div>`;
            
            if (querySnapshot.empty) {
                contenu.innerHTML = "<p class='text-success fs-5'>Aucun retard détecté pour le moment !</p>";
            } else {
                html += `<h5 class="mt-4 text-light">Expédier les rapports aux superviseurs :</h5>`;
                for (let [email, details] of Object.entries(retardsParSuperviseur)) {
                    html += `<button class="btn btn-danger m-1" onclick="window.location.href='mailto:${email}?subject=Rapport des retards de suivi&body=Voici vos dossiers en retard :%0A%0A${details}'">Envoyer à ${email}</button> `;
                }
                contenu.innerHTML = html;
            }
        };

        // --- RECHERCHE ---
        window.executerRecherche = async () => {
            const critere = document.getElementById('critereRecherche').value.trim();
            if (!critere) {
                alert("Veuillez entrer un nom ou un ID.");
                return;
            }

            bootstrap.Modal.getInstance(document.getElementById('modalRecherche')).hide();
            const zone = document.getElementById('zone-affichage');
            const titre = document.getElementById('titre-zone');
            const contenu = document.getElementById('contenu-zone');
            
            zone.classList.remove('d-none');
            titre.textContent = `Résultats de recherche pour : "${critere}"`;
            contenu.innerHTML = "<p>Recherche en cours...</p>";

            const qNom = query(collection(db, "interventions"), where("nom", "==", critere), orderBy("date", "asc"));
            const qId = query(collection(db, "interventions"), where("idEmploye", "==", critere), orderBy("date", "asc"));

            const [snapNom, snapId] = await Promise.all([getDocs(qNom), getDocs(qId)]);
            
            let interventionsMap = new Map();
            snapNom.forEach(d => interventionsMap.set(d.id, d.data()));
            snapId.forEach(d => interventionsMap.set(d.id, d.data()));

            let resultats = Array.from(interventionsMap.values());
            resultats.sort((a, b) => new Date(a.date) - new Date(b.date));

            if (resultats.length === 0) {
                contenu.innerHTML = "<p class='text-muted fs-5'>Aucune intervention trouvée pour cet employé.</p>";
                return;
            }

            let html = `<div class="table-responsive"><table class="table table-bordered table-striped"><thead><tr><th>Date</th><th>ID</th><th>Nom</th><th>Ancienneté</th><th>Description</th><th>Prochain RDV</th><th>Superviseur</th></tr></thead><tbody>`;
            resultats.forEach(data => {
                html += `<tr><td>${data.date}</td><td>${data.idEmploye}</td><td>${data.nom}</td><td>${data.anciennete || 'N/A'}</td><td>${data.description}</td><td>Dans ${data.prochainRdvJours} jours</td><td>${data.superviseurEmail}</td></tr>`;
            });
            html += `</tbody></table></div>`;
            contenu.innerHTML = html;
        };
    </script>
</body>
</html>
