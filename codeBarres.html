<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Génération de Code-barres LC0001</title>
    <!-- Chargement de la bibliothèque JsBarcode via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>

    <!-- L'élément SVG où le code-barres sera dessiné -->
    <svg id="mon-code-barres"></svg>

    <script>
        // Génération automatique au chargement de la page
        JsBarcode("#mon-code-barres", "LC0001", {
            format: "CODE128", // Format standard
            lineColor: "#000000", // Couleur des barres
            width: 2, // Épaisseur des barres
            height: 100, // Hauteur du code-barres
            displayValue: true, // Affiche le texte "LC0001" en dessous
            fontSize: 20
        });
    </script>

</body>
</html>
