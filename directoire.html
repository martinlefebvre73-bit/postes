<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postes Canada — Directoires des Routes</title>
  <meta name="theme-color" content="#0d1b2a">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --bg-dark: #0d1b2a;
      --card-dark: #162436;
      --card-border: rgba(212, 175, 55, 0.28);
      --gold: #d4af37;
      --gold-hover: #e5c158;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-blue: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--card-dark);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-badge {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: var(--gold);
      font-size: 15px;
    }
    .brand h1 {
      font-size: 1.2rem;
      color: #fff;
      letter-spacing: 0.03em;
    }
    .brand span {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--gold);
      display: block;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-back {
      background: #334155;
      color: #f8fafc;
    }
    .btn-back:hover { background: #475569; }
    .btn-print {
      background: var(--gold);
      color: #0d1b2a;
    }
    .btn-print:hover { background: var(--gold-hover); }

    .search-panel {
      background: var(--card-dark);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .search-input {
      flex: 1;
      min-width: 220px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #09131e;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--gold);
    }
    .btn-search {
      padding: 14px 24px;
      border-radius: 12px;
      border: none;
      background: var(--accent-blue);
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
    }
    .btn-search:hover { background: #1d4ed8; }
    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .pill {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #09131e;
      border: 1px solid #334155;
      color: var(--text-muted);
      cursor: pointer;
    }
    .pill.active {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(212, 175, 55, 0.12);
    }

    .matches-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .match-chip {
      padding: 8px 14px;
      border-radius: 10px;
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .match-chip.active {
      background: var(--gold);
      color: #0d1b2a;
      border-color: var(--gold);
    }

    .route-card {
      background: var(--card-dark);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }
    .route-header {
      border-bottom: 1px solid #334155;
      padding-bottom: 14px;
      margin-bottom: 16px;
    }
    .route-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(37, 99, 235, 0.25);
      border: 1px solid #3b82f6;
      color: #93c5fd;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .route-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .meta-box {
      background: #09131e;
      border: 1px solid #293548;
      border-radius: 10px;
      padding: 10px 14px;
    }
    .meta-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .meta-val {
      font-size: 0.9rem;
      color: #f8fafc;
      font-weight: 600;
      word-break: break-word;
    }

    .table-filter-wrap {
      margin-bottom: 12px;
    }
    .table-filter {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #09131e;
      color: #fff;
      font-size: 0.9rem;
    }
    .table-wrap {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid #334155;
      max-height: 68vh;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }
    td {
      padding: 8px 10px;
      border-bottom: 1px solid #1e293b;
      border-right: 1px solid #1e293b;
      color: #e2e8f0;
      vertical-align: top;
    }
    tr:nth-child(even) td {
      background: rgba(15, 23, 42, 0.45);
    }
    tr.section-row td {
      background: rgba(212, 175, 55, 0.16);
      color: var(--gold);
      font-weight: 700;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 8px;
      margin-top: 16px;
    }
    .quick-btn {
      padding: 10px 6px;
      border-radius: 8px;
      background: #09131e;
      border: 1px solid #334155;
      color: #e2e8f0;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: center;
    }
    .quick-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    @media print {
      body { background: #fff; color: #000; padding: 0; }
      .top-bar, .search-panel, .matches-bar, .table-filter-wrap { display: none !important; }
      .route-card { background: #fff; border: none; box-shadow: none; padding: 0; }
      .route-title, .meta-val { color: #000; }
      .meta-box { background: #f8fafc; border: 1px solid #cbd5e1; }
      .meta-label { color: #1e293b; }
      .table-wrap { max-height: none; overflow: visible; border: 1px solid #94a3b8; }
      td { color: #000; border: 1px solid #cbd5e1; padding: 4px 6px; font-size: 10px; }
      tr.section-row td { background: #e2e8f0 !important; color: #000 !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="brand">
        <div class="brand-badge">PC</div>
        <div>
          <span>Postes Canada • Dépôt Aéroport</span>
          <h1>Directoires des Routes</h1>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-print" onclick="window.print()">Imprimer</button>
        <button class="btn btn-back" onclick="location.href='index.html'">Menu Principal</button>
      </div>
    </div>

    <div class="search-panel">
      <div class="search-row">
        <input type="text" id="routeInput" class="search-input" placeholder="Numéro de route (ex: 4, 24, 88, 205, 310)..." autofocus>
        <button class="btn-search" onclick="rechercherRoute()">Ouvrir</button>
      </div>
      <div class="filter-pills">
        <button class="pill active" data-depot="ALL" onclick="setDepotFilter('ALL', this)">Tous (Aéroport 1 & 2)</button>
        <button class="pill" data-depot="Aéroport 1" onclick="setDepotFilter('Aéroport 1', this)">Aéroport 1 (1 – 195)</button>
        <button class="pill" data-depot="Aéroport 2" onclick="setDepotFilter('Aéroport 2', this)">Aéroport 2 (201 – 310)</button>
      </div>
    </div>

    <div id="matchesBar" class="matches-bar" style="display:none;"></div>

    <div id="viewerArea" class="route-card">
      <div class="empty-state">
        <p style="font-size:1rem; color:#fff; font-weight:600; margin-bottom:6px;">Entrez un numéro de route ci-dessus ou choisissez un accès rapide</p>
        <p style="font-size:0.82rem;">128 feuilles chargées (Aéroport 1 & Aéroport 2 — Hors ligne)</p>
        <div id="quickList" class="quick-grid"></div>
      </div>
    </div>
  </div>

    let ROUTES_DATA = [];
    let currentDepot = "ALL";
    let currentRoute = null;

    async function initData() {
      const binStr = atob(COMPRESSED_B64);
      const bytes = new Uint8Array(binStr.length);
      for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);

      const ds = new DecompressionStream("deflate");
      const writer = ds.writable.getWriter();
      writer.write(bytes);
      writer.close();

      const resp = new Response(ds.readable);
      const text = await resp.text();
      ROUTES_DATA = JSON.parse(text);

      renderQuickList();

      // Vérifier si un numéro a été passé dans l'URL (?route=205)
      const params = new URLSearchParams(window.location.search);
      const urlRoute = params.get("route");
      if (urlRoute) {
        document.getElementById("routeInput").value = urlRoute;
        rechercherRoute();
      }
    }

    function setDepotFilter(depot, btn) {
      currentDepot = depot;
      document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      if (document.getElementById("routeInput").value.trim()) {
        rechercherRoute();
      } else {
        renderQuickList();
      }
    }

    function renderQuickList() {
      const container = document.getElementById("quickList");
      if (!container) return;
      const filtered = ROUTES_DATA.filter(r => currentDepot === "ALL" || r.depot === currentDepot);
      container.innerHTML = filtered.map((r) => {
        const globalIdx = ROUTES_DATA.indexOf(r);
        return `<button class="quick-btn" onclick="afficherRoute(${globalIdx})">${escapeHtml(r.name)}</button>`;
      }).join("");
    }

    function rechercherRoute() {
      const raw = document.getElementById("routeInput").value.trim();
      if (!raw) return;

      const digits = raw.replace(/\D/g, "");
      const pool = ROUTES_DATA.filter(r => currentDepot === "ALL" || r.depot === currentDepot);

      let matches = [];
      if (digits) {
        matches = pool.filter(r => r.num === digits);
      }
      if (matches.length === 0) {
        const q = raw.toLowerCase();
        matches = pool.filter(r => r.name.toLowerCase().includes(q) || r.title.toLowerCase().includes(q));
      }

      // Prioriser la feuille principale (non map/info) en premier
      matches.sort((a, b) => (a.isAux === b.isAux) ? 0 : (a.isAux ? 1 : -1));

      const matchesBar = document.getElementById("matchesBar");
      if (matches.length === 0) {
        matchesBar.style.display = "none";
        document.getElementById("viewerArea").innerHTML = `
          <div class="empty-state">
            <p style="color:#f87171; font-weight:700; font-size:1rem;">Aucun directoire trouvé pour « ${escapeHtml(raw)} »</p>
            <p style="font-size:0.82rem; margin-top:6px;">Vérifiez le numéro ou changez le filtre Aéroport 1 / Aéroport 2.</p>
          </div>`;
        return;
      }

      if (matches.length > 1) {
        matchesBar.style.display = "flex";
        matchesBar.innerHTML = matches.map(m => {
          const idx = ROUTES_DATA.indexOf(m);
          return `<button class="match-chip" id="chip-${idx}" onclick="afficherRoute(${idx})">${escapeHtml(m.name)} (${m.depot})</button>`;
        }).join("");
      } else {
        matchesBar.style.display = "none";
      }

      afficherRoute(ROUTES_DATA.indexOf(matches[0]));
    }

    function afficherRoute(index) {
      const r = ROUTES_DATA[index];
      if (!r) return;
      currentRoute = r;

      document.querySelectorAll(".match-chip").forEach(c => c.classList.remove("active"));
      const activeChip = document.getElementById(`chip-${index}`);
      if (activeChip) activeChip.classList.add("active");

      const metaHtml = `
        <div class="meta-grid">
          <div class="meta-box">
            <div class="meta-label">Dépôt / Onglet</div>
            <div class="meta-val">${escapeHtml(r.depot)} — ${escapeHtml(r.name)}</div>
          </div>
          ${r.pdr ? `<div class="meta-box"><div class="meta-label">Total PDR / POC</div><div class="meta-val">${escapeHtml(r.pdr)}</div></div>` : ""}
          ${r.keys ? `<div class="meta-box"><div class="meta-label">Clés / Keys</div><div class="meta-val">${escapeHtml(r.keys)}</div></div>` : ""}
          ${r.instructions ? `<div class="meta-box" style="grid-column: 1 / -1;"><div class="meta-label">Instructions spéciales</div><div class="meta-val">${escapeHtml(r.instructions)}</div></div>` : ""}
        </div>`;

      const rowsHtml = r.rows.map((row, rIdx) => {
        const isHeader = rIdx === 0 || row.some(c => /arrêt|rue\/street|levée|ramassage|surtemps/i.test(c));
        const cells = row.map(cell => `<td>${escapeHtml(cell)}</td>`).join("");
        return `<tr class="${isHeader ? 'section-row' : ''}">${cells}</tr>`;
      }).join("");

      document.getElementById("viewerArea").innerHTML = `
        <div class="route-header">
          <span class="route-tag">${escapeHtml(r.depot)} • Feuille ${escapeHtml(r.name)}</span>
          <h2 class="route-title">${escapeHtml(r.title)}</h2>
        </div>
        ${metaHtml}
        <div class="table-filter-wrap">
          <input type="text" class="table-filter" placeholder="Filtrer une rue, une adresse ou un arrêt dans cette route..." oninput="filtrerLignes(this.value)">
        </div>
        <div class="table-wrap">
          <table id="routeTable">
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      `;
    }

    function filtrerLignes(terme) {
      const q = terme.toLowerCase().trim();
      const trs = document.querySelectorAll("#routeTable tbody tr");
      trs.forEach((tr, idx) => {
        if (idx === 0) return;
        const txt = tr.textContent.toLowerCase();
        tr.style.display = txt.includes(q) ? "" : "none";
      });
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    document.getElementById("routeInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") rechercherRoute();
    });

    initData();
  </script>
