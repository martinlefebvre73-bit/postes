<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observation CQ - Suivi Professionnel</title>
    <!-- Bootstrap CSS pour l'interface -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d1b2a; /* Fond bleu foncé professionnel */
            color: #e0e1dd;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card, .modal-content {
            background-color: #1b263b;
            color: #e0e1dd;
            border: 1px solid #415a77;
        }
        .form-control, .form-select {
            background-color: #0d1b2a;
            color: #e0e1dd;
            border: 1px solid #415a77;
        }
        .form-control:focus, .form-select:focus {
            background-color: #1b263b;
            color: #ffffff;
            border-color: #778da9;
            box-shadow: 0 0 0 0.25rem rgba(119, 141, 169, 0.25);
        }
        .table {
            color: #e0e1dd;
        }
        .table-striped > tbody > tr:nth-of-type(odd) {
            background-color: rgba(255, 255, 255, 0.05);
            color: #e0e1dd;
        }
        .table-bordered {
            border-color: #415a77;
        }
        .table-bordered td, .table-bordered th {
            border-color: #415a77;
        }
        .btn-menu-egal {
            flex: 1;
            min-width: 160px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .text-rose-pale {
            color: #ffb3c6 !important;
        }

        /* --- CONFIGURATION DE L'IMPRESSION EN MODE PAYSAGE --- */
        @media print {
            @page {
                size: landscape;
                margin: 1cm;
            }
            body {
                background-color: #ffffff !important;
                color: #000000 !important;
            }
            #vue-accueil, .btn, form, h1, #select-type-container {
                display: none !important;
            }
            #zone-affichage {
                display: block !important;
                background-color: #ffffff !important;
                color: #000000 !important;
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            #zone-affichage h3 {
                color: #000000 !important;
                font-size: 1.5rem;
                margin-bottom: 20px;
            }
            .table {
                color: #000000 !important;
                border-color: #000000 !important;
                width: 100% !important;
                font-size: 0.9rem;
            }
            .table-striped > tbody > tr:nth-of-type(odd) {
                background-color: rgba(0, 0, 0, 0.05) !important;
                color: #000000 !important;
            }
            .table-bordered td, .table-bordered th {
                border-color: #000000 !important;
            }
        }
    </style>
</head>
<body>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <button class="btn btn-outline-light btn-sm" onclick="location.href='index.html'">← Retour au menu principal</button>
            <h1 class="text-center text-white fw-bold m-0">Tableau de Bord - Observation CQ</h1>
            <div></div>
        </div>

        <!-- PAGE D'ACCUEIL / LISTING -->
        <div id="vue-accueil">
            <div class="card shadow-lg p-4 mb-4 text-center">
                <div class="d-flex justify-content-center gap-3 flex-wrap">
                    <button class="btn btn-success btn-menu-egal" onclick="afficherPageSaisie()">Nouvelle Observation CQ</button>
                    <button class="btn btn-info btn-menu-egal text-dark" onclick="ouvrirModalRecherche()">Rechercher une observation</button>
                    <button class="btn btn-outline-light btn-menu-egal" onclick="chargerToutesObservations()">Afficher toutes les observations</button>
                </div>
            </div>

            <!-- ZONE D'AFFICHAGE DES RAPPORTS / LISTES -->
            <div id="zone-affichage" class="card shadow-sm p-4 mt-4">
                <h3 id="titre-zone" class="m-0 mb-3">Liste des Observations CQ Récentes</h3>
                <div id="contenu-zone">
                    <p class="text-muted">Chargement des données...</p>
                </div>
            </div>
        </div>

        <!-- VUE SAISIE / MODIFICATION : OBSERVATION CQ -->
        <div id="vue-saisie" class="card shadow-lg p-5 d-none">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="text-light" id="titreFormulaire">Nouvelle Observation CQ</h2>
                <button class="btn btn-outline-light" onclick="retourAccueil()">← Retour</button>
            </div>
            
            <form id="formObservationCQ">
                <input type="hidden" id="editIdDoc">

                <!-- SECTION 1 : EMPLOYÉ OBSERVÉ -->
                <h5 class="text-warning border-bottom border-secondary pb-2 mb-3">1. Identification de l'Employé Observé</h5>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Employé observé (Nom & Prénom)</label>
                        <select class="form-select" id="nomEmploye" required onchange="remplirParNom(this)">
                            <option value="">-- Choisir par nom --</option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">ID de l'employé</label>
                        <input type="text" class="form-control" id="idEmploye" placeholder="Ex: 12345" oninput="remplirParId(this)">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Ancienneté</label>
                        <input type="text" class="form-control" id="ancienneteEmploye" readonly placeholder="Automatique">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Date observée</label>
                        <input type="date" class="form-control" id="dateObserve" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Itinéraire</label>
                        <input type="text" class="form-control" id="itineraire" placeholder="Ex: Itinéraire 42">
                    </div>
                </div>

                <!-- SECTION 2 : TIERS OBSERVÉ -->
                <h5 class="text-warning border-bottom border-secondary pb-2 mb-3">2. Tiers Observé</h5>
                <div class="mb-4 p-3 border border-secondary rounded bg-dark">
                    <label class="form-label text-warning fw-bold mb-2">Sélectionnez le profil du tiers (Choix unique) :</label>
                    <div class="d-flex gap-4 flex-wrap">
                        <div class="form-check">
                            <input class="form-check-input tiers-radio" type="radio" name="tiersObserve" id="tiersCarreOrange" value="1/3 carré orange" required>
                            <label class="form-check-label text-light" for="tiersCarreOrange">
                                🟧 1/3 carré orange
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input tiers-radio" type="radio" name="tiersObserve" id="tiersCarreRose" value="2/3 carré rose">
                            <label class="form-check-label text-rose-pale fw-bold" for="tiersCarreRose">
                                <span style="display:inline-block; width:14px; height:14px; background-color:#ffb3c6; margin-right:4px; vertical-align:middle; border-radius:2px;"></span> 2/3 carré rose
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input tiers-radio" type="radio" name="tiersObserve" id="tiersCarreBleu" value="3/3 carré bleu">
                            <label class="form-check-label text-light" for="tiersCarreBleu">
                                🟦 3/3 carré bleu
                            </label>
                        </div>
                    </div>
                </div>

                <!-- SECTION 3 : CQ OBSERVÉ -->
                <h5 class="text-warning border-bottom border-secondary pb-2 mb-3">3. CQ Observé (8 lignes)</h5>
                <div id="contenuLignesCQ" class="mb-3">
                    <!-- Les 8 lignes dynamiques de CQ seront injectées ici -->
                </div>
                <div class="mb-4">
                    <button type="button" class="btn btn-outline-warning btn-sm" onclick="ajouterLigneCQ()">+ Ajouter un CQ supplémentaire</button>
                </div>

                <!-- SECTION 4 : LOCALISATION ET TEMPOREL -->
                <h5 class="text-warning border-bottom border-secondary pb-2 mb-3">4. Localisation et Horodatage</h5>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold text-light">Section rue observée - De :</label>
                        <input type="text" class="form-control" id="sectionRueDe" placeholder="Ex: 100 rue Principale" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold text-light">Section rue observée - À :</label>
                        <input type="text" class="form-control" id="sectionRueA" placeholder="Ex: 250 rue Principale" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label class="form-label fw-bold text-light">Date et heure de l'observation</label>
                        <input type="datetime-local" class="form-control" id="dateHeureObservation" required>
                    </div>
                </div>

                <!-- SECTION 5 : COMMENTAIRES & PIÈCES JOINTES -->
                <h5 class="text-warning border-bottom border-secondary pb-2 mb-3">5. Commentaires et Pièces Jointes</h5>
                <div class="mb-3">
                    <label class="form-label">Commentaires (Dictée vocale possible)</label>
                    <div class="input-group">
                        <textarea class="form-control" id="commentaires" rows="4" placeholder="Cliquez sur le micro pour dicter vos observations..."></textarea>
                        <button type="button" class="btn btn-outline-light" onclick="demarrerDictee()">🎤 Dicter</button>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Pièces jointes (Style photo)</label>
                    <input type="file" class="form-control" id="pieceJointe" accept="image/*" multiple>
                    <div id="apercuFichiers" class="mt-2 text-muted small"></div>
                </div>

                <div class="d-flex gap-3 mt-4">
                    <button type="submit" class="btn btn-success btn-lg flex-grow-1" id="btnEnregistrer">Enregistrer l'Observation CQ</button>
                    <button type="button" class="btn btn-secondary btn-lg" onclick="retourAccueil()">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL : RECHERCHE -->
    <div class="modal fade" id="modalRecherche" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-light">Rechercher une observation CQ</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nom, ID, Itinéraire, CQ, Codage, PDR ou Rue</label>
                        <input type="text" class="form-control" id="critereRecherche" placeholder="Entrez un nom, ID, itinéraire, CQ, codage, PDR ou mot-clé">
                    </div>
                    <button type="button" class="btn btn-info w-100 text-dark fw-bold" onclick="executerRecherche()">Rechercher</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBksqM25AZOEPLmaOcbOHjORx78sGyGicc",
            authDomain: "postesst.firebaseapp.com",
            projectId: "postesst",
            storageBucket: "postesst.firebasestorage.app",
            messagingSenderId: "39362155503",
            appId: "1:39362155503:web:26b59f9eca20443c4c9c1a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let listeEmployesMemoire = [];

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.initialiserDonnees();
            } else {
                alert("Veuillez vous connecter pour accéder aux observations CQ.");
                window.location.href = "index.html";
            }
        });

        window.initialiserDonnees = async () => {
            await chargerEmployes();
            await chargerToutesObservations();
        };

        window.afficherPageSaisie = () => {
            document.getElementById('vue-accueil').classList.add('d-none');
            document.getElementById('vue-saisie').classList.remove('d-none');
            document.getElementById('formObservationCQ').reset();
            document.getElementById('editIdDoc').value = '';
            document.getElementById('titreFormulaire').textContent = "Nouvelle Observation CQ";
            document.getElementById('btnEnregistrer').textContent = "Enregistrer l'Observation CQ";
            
            document.getElementById('contenuLignesCQ').innerHTML = '';
            
            // Génère 8 lignes de CQ par défaut à l'ouverture
            for (let i = 0; i < 8; i++) {
                window.ajouterLigneCQ(null, i === 0);
            }

            const maintenant = new Date();
            const annee = maintenant.getFullYear();
            const mois = String(maintenant.getMonth() + 1).padStart(2, '0');
            const jour = String(maintenant.getDate()).padStart(2, '0');
            const heure = String(maintenant.getHours()).padStart(2, '0');
            const minute = String(maintenant.getMinutes()).padStart(2, '0');
            
            document.getElementById('dateObserve').value = `${annee}-${mois}-${jour}`;
            document.getElementById('dateHeureObservation').value = `${annee}-${mois}-${jour}T${heure}:${minute}`;
        };

        window.ajouterLigneCQ = (data = null, estPremiere = false) => {
            const conteneur = document.getElementById('contenuLignesCQ');

            const aujourdHui = new Date().toISOString().split('T')[0];
            const nomCQ = data ? data.nomCQ || '' : '';
            const dateDebut = data ? data.dateDebut || aujourdHui : aujourdHui;
            const dateFin = data ? data.dateFin || aujourdHui : aujourdHui;
            const codage = data ? data.codage || '' : '';
            const domChecked = data && data.pdr?.dom ? 'checked' : '';
            const aptsChecked = data && data.pdr?.apts ? 'checked' : '';
            const comChecked = data && data.pdr?.com ? 'checked' : '';
            const quantite = data ? data.quantite || '' : '';

            const ligneDiv = document.createElement('div');
            ligneDiv.className = 'row align-items-center mb-3 p-3 border border-secondary rounded bg-dark position-relative ligne-cq g-2';
            
            let boutonActionHtml = estPremiere 
                ? `<div class="col-md-1 text-end pt-3"><span class="badge bg-secondary text-light mt-2" title="Ligne principale obligatoire">Principal</span></div>`
                : `<div class="col-md-1 text-end pt-3"><button type="button" class="btn btn-outline-danger btn-sm mt-2" onclick="this.closest('.ligne-cq').remove()">✕</button></div>`;

            ligneDiv.innerHTML = `
                <div class="col-md-2">
                    <label class="form-label small text-warning fw-bold">Nom du CQ</label>
                    <input type="text" class="form-control form-control-sm cq-nom" placeholder="Nom du CQ" value="${nomCQ}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-warning fw-bold">Date début</label>
                    <input type="date" class="form-control form-control-sm cq-debut" value="${dateDebut}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-warning fw-bold">Date fin</label>
                    <input type="date" class="form-control form-control-sm cq-fin" value="${dateFin}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-warning fw-bold">Codage</label>
                    <input type="text" class="form-control form-control-sm cq-codage" placeholder="Codage" value="${codage}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-warning fw-bold d-block">PDR</label>
                    <div class="d-flex gap-2 pt-1">
                        <div class="form-check form-check-inline m-0">
                            <input class="form-check-input pdr-dom" type="checkbox" ${domChecked}>
                            <label class="form-check-label text-light small">Dom</label>
                        </div>
                        <div class="form-check form-check-inline m-0">
                            <input class="form-check-input pdr-apts" type="checkbox" ${aptsChecked}>
                            <label class="form-check-label text-light small">Apts</label>
                        </div>
                        <div class="form-check form-check-inline m-0">
                            <input class="form-check-input pdr-com" type="checkbox" ${comChecked}>
                            <label class="form-check-label text-light small">Com</label>
                        </div>
                    </div>
                </div>
                <div class="col-md-1">
                    <label class="form-label small text-warning fw-bold">Qté</label>
                    <input type="number" class="form-control form-control-sm cq-qte" placeholder="Qté" value="${quantite}" min="0">
                </div>
                ${boutonActionHtml}
            `;
            contenu.appendChild(ligneDiv);
        };

        window.retourAccueil = () => {
            document.getElementById('vue-saisie').classList.add('d-none');
            document.getElementById('vue-accueil').classList.remove('d-none');
            window.chargerToutesObservations();
        };

        window.ouvrirModalRecherche = () => new bootstrap.Modal(document.getElementById('modalRecherche')).show();

        async function chargerEmployes() {
            const selectEmp = document.getElementById('nomEmploye');
            try {
                const querySnapshot = await getDocs(collection(db, "employes"));
                selectEmp.innerHTML = '<option value="">-- Choisir par nom --</option>';
                
                listeEmployesMemoire = [];
                querySnapshot.forEach((doc) => {
                    listeEmployesMemoire.push(doc.data());
                });

                listeEmployesMemoire.sort((a, b) => {
                    let nomA = (a.nom || '').toLowerCase();
                    let nomB = (b.nom || '').toLowerCase();
                    if (nomA < nomB) return -1;
                    if (nomA > nomB) return 1;
                    let prenomA = (a.prenom || '').toLowerCase();
                    let prenomB = (b.prenom || '').toLowerCase();
                    return prenomA.localeCompare(prenomB);
                });

                listeEmployesMemoire.forEach((emp) => {
                    let option = document.createElement('option');
                    let nomComplet = `${emp.nom || ''} ${emp.prenom || ''}`.trim();
                    let employeId = emp.idEmploye !== undefined ? emp.idEmploye : (emp.id !== undefined ? emp.id : '');
                    
                    option.value = nomComplet; 
                    option.dataset.id = employeId; 
                    option.dataset.anciennete = emp.anciennete || 'Non spécifiée';
                    
                    option.textContent = `${emp.nom || ''}, ${emp.prenom || ''} (ID: ${employeId})`;
                    selectEmp.appendChild(option);
                });
            } catch (e) {
                console.error("Erreur chargement employés: ", e);
            }
        }

        window.remplirParNom = (selectElement) => {
            const selectedOption = selectElement.options[selectElement.selectedIndex];
            if (selectedOption.value) {
                document.getElementById('idEmploye').value = selectedOption.dataset.id || '';
                document.getElementById('ancienneteEmploye').value = selectedOption.dataset.anciennete || '';
            } else {
                document.getElementById('idEmploye').value = '';
                document.getElementById('ancienneteEmploye').value = '';
            }
        };

        window.remplirParId = (inputElement) => {
            const saisieId = inputElement.value.trim().toLowerCase();
            const selectEmp = document.getElementById('nomEmploye');

            if (!saisieId) {
                selectEmp.value = '';
                document.getElementById('ancienneteEmploye').value = '';
                return;
            }

            let trouve = listeEmployesMemoire.find(emp => {
                let idEmp = String(emp.idEmploye !== undefined ? emp.idEmploye : (emp.id !== undefined ? emp.id : '')).toLowerCase();
                return idEmp === saisieId;
            });

            if (trouve) {
                let nomComplet = `${trouve.nom || ''} ${trouve.prenom || ''}`.trim();
                selectEmp.value = nomComplet;
                document.getElementById('ancienneteEmploye').value = trouve.anciennete || 'Non spécifiée';
            } else {
                selectEmp.value = '';
                document.getElementById('ancienneteEmploye').value = 'ID non trouvé';
            }
        };

        window.demarrerDictee = () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("La dictée vocale n'est pas supportée par votre navigateur.");
                return;
            }
            const reconnaissance = new SpeechRecognition();
            reconnaissance.lang = 'fr-FR';
            reconnaissance.onresult = (event) => {
                document.getElementById('commentaires').value += " " + event.results[0][0].transcript;
            };
            reconnaissance.start();
        };

        document.getElementById('formObservationCQ').addEventListener('submit', async (e) => {
            e.preventDefault();
            const idDoc = document.getElementById('editIdDoc').value;
            const nomEmploye = document.getElementById('nomEmploye').value.trim();
            const idEmploye = document.getElementById('idEmploye').value.trim();

            if (!nomEmploye || !idEmploye) {
                alert("Veuillez sélectionner un employé observé valide.");
                return;
            }

            const lignesDivs = document.querySelectorAll('.ligne-cq');
            if (lignesDivs.length === 0) {
                alert("Veuillez ajouter au moins un CQ observé.");
                return;
            }

            let cqObserveListe = [];
            lignesDivs.forEach(div => {
                let nomCQ = div.querySelector('.cq-nom').value.trim();
                // N'enregistre que les lignes qui contiennent un nom de CQ rempli (optionnel, ou toutes si vous préférez)
                if (nomCQ !== '') {
                    cqObserveListe.push({
                        nomCQ: nomCQ,
                        dateDebut: div.querySelector('.cq-debut').value,
                        dateFin: div.querySelector('.cq-fin').value,
                        codage: div.querySelector('.cq-codage').value.trim(),
                        pdr: {
                            dom: div.querySelector('.pdr-dom').checked,
                            apts: div.querySelector('.pdr-apts').checked,
                            com: div.querySelector('.pdr-com').checked
                        },
                        quantite: div.querySelector('.cq-qte').value.trim()
                    });
                }
            });

            if (cqObserveListe.length === 0) {
                alert("Veuillez remplir au moins une ligne de CQ (Nom du CQ).");
                return;
            }

            const tiersSelectionne = document.querySelector('input[name="tiersObserve"]:checked');
            const tiers = tiersSelectionne ? tiersSelectionne.value : '';

            const fichiersInput = document.getElementById('pieceJointe');
            let nomsFichiers = [];
            for (let i = 0; i < fichiersInput.files.length; i++) {
                nomsFichiers.push(fichiersInput.files[i].name);
            }

            const observationData = {
                nomEmploye: nomEmploye,
                idEmploye: idEmploye,
                anciennete: document.getElementById('ancienneteEmploye').value,
                dateObserve: document.getElementById('dateObserve').value,
                itineraire: document.getElementById('itineraire').value.trim(),
                cqObserveListe: cqObserveListe,
                tiersObserve: tiers,
                sectionRueDe: document.getElementById('sectionRueDe').value.trim(),
                sectionRueA: document.getElementById('sectionRueA').value.trim(),
                dateHeureObservation: document.getElementById('dateHeureObservation').value,
                commentaires: document.getElementById('commentaires').value.trim(),
                piecesJointes: nomsFichiers,
                derniereMiseAJour: new Date().toISOString()
            };

            try {
                if (idDoc) {
                    const docRef = doc(db, "CQ", idDoc);
                    await updateDoc(docRef, observationData);
                    alert("Observation CQ modifiée avec succès !");
                } else {
                    await addDoc(collection(db, "CQ"), observationData);
                    alert("Observation CQ enregistrée avec succès dans la collection 'CQ' !");
                }
                window.retourAccueil();
            } catch (erreur) {
                console.error("Erreur lors de l'enregistrement : ", erreur);
                alert("Erreur lors de l'enregistrement dans Firebase.");
            }
        });

        window.chargerToutesObservations = async () => {
            const contenu = document.getElementById('contenu-zone');
            document.getElementById('titre-zone').textContent = "Liste des Observations CQ Récentes";
            contenu.innerHTML = "<p>Chargement des observations...</p>";

            try {
                const querySnapshot = await getDocs(collection(db, "CQ"));
                let resultats = [];
                querySnapshot.forEach((docSnap) => {
                    resultats.push({
                        id: docSnap.id,
                        ...docSnap.data()
                    });
                });

                resultats.sort((a, b) => new Date(b.dateHeureObservation || 0) - new Date(a.dateHeureObservation || 0));

                if (resultats.length === 0) {
                    contenu.innerHTML = "<p class='text-muted fs-5'>Aucune observation CQ enregistrée pour le moment.</p>";
                    return;
                }

                construireTableauObservations(resultats);
            } catch (e) {
                console.error("Erreur chargement CQ :", e);
                contenu.innerHTML = "<p class='text-danger'>Erreur lors du chargement des observations CQ.</p>";
            }
        };

        function construireTableauObservations(resultats) {
            const contenu = document.getElementById('contenu-zone');
            let html = `<div class="mb-3"><button class="btn btn-outline-light btn-sm" onclick="window.print()">🖨️ Imprimer le rapport</button></div>`;
            html += `<div class="table-responsive"><table class="table table-striped table-bordered align-middle">`;
            html += `<thead><tr><th>Date observée</th><th>Employé observé</th><th>ID</th><th>Itinéraire</th><th>Détails CQ Observés (Codage, PDR)</th><th>Tiers Observé</th><th>Rue (De - à)</th><th>Actions</th></tr></thead><tbody>`;

            resultats.forEach(item => {
                let listeCQ = item.cqObserveListe || (item.cqObserve ? [item.cqObserve] : []);
                let cqHtml = listeCQ.map(cq => {
                    let pdrObj = cq.pdr || cq.distribution || {};
                    let pdrTxt = [];
                    if (pdrObj.dom) pdrTxt.push('Dom');
                    if (pdrObj.apts) pdrTxt.push('Apts');
                    if (pdrObj.com) pdrTxt.push('Com');
                    let codageTxt = cq.codage ? ` - Codage: ${cq.codage}` : '';
                    return `• <strong>${cq.nomCQ || 'N/A'}</strong> (${cq.dateDebut || '?'} au ${cq.dateFin || '?'})${codageTxt} [PDR: ${pdrTxt.join(', ') || 'Aucun'}] - Qté: ${cq.quantite || '0'}`;
                }).join('<br>');

                let badgeStyle = "bg-info text-dark";
                let badgeTiersHtml = item.tiersObserve === "2/3 carré rose" 
                    ? `<span class="badge" style="background-color: #ffb3c6; color: #000;"><span style="display:inline-block; width:10px; height:10px; background-color:#ffb3c6; border:1px solid #000; margin-right:3px; vertical-align:middle;"></span>${item.tiersObserve}</span>`
                    : `<span class="badge ${badgeStyle}">${item.tiersObserve || 'N/A'}</span>`;

                let rueDe = item.sectionRueDe || '';
                let rueA = item.sectionRueA || '';
                let rueTexte = (rueDe || rueA) ? `${rueDe} à ${rueA}` : (item.sectionRue || 'N/A');

                html += `<tr>
                    <td>${item.dateObserve || 'N/A'}</td>
                    <td><strong>${item.nomEmploye || 'N/A'}</strong></td>
                    <td>${item.idEmploye || 'N/A'}</td>
                    <td>${item.itineraire || 'N/A'}</td>
                    <td><small>${cqHtml || 'Aucun CQ'}</small></td>
                    <td>${badgeTiersHtml}</td>
                    <td>${rueTexte}</td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="preparerModification('${item.id}')">Modifier</button>
                    </td>
                </tr>`;
            });

            html += `</tbody></table></div>`;
            contenu.innerHTML = html;
        }

        window.preparerModification = async (idDoc) => {
            try {
                const docRef = doc(db, "CQ", idDoc);
                const docSnap = await getDoc(docRef);
                if (!docSnap.exists()) {
                    alert("Observation introuvable.");
                    return;
                }
                const data = docSnap.data();

                document.getElementById('editIdDoc').value = idDoc;
                document.getElementById('titreFormulaire').textContent = "Modifier l'Observation CQ";
                document.getElementById('btnEnregistrer').textContent = "Mettre à jour l'Observation";

                document.getElementById('nomEmploye').value = data.nomEmploye || '';
                document.getElementById('idEmploye').value = data.idEmploye || '';
                document.getElementById('ancienneteEmploye').value = data.anciennete || '';
                document.getElementById('dateObserve').value = data.dateObserve || '';
                document.getElementById('itineraire').value = data.itineraire || '';

                document.getElementById('contenuLignesCQ').innerHTML = '';
                let listeCQ = data.cqObserveListe || (data.cqObserve ? [data.cqObserve] : []);
                
                if (listeCQ.length > 0) {
                    listeCQ.forEach((cq, index) => {
                        window.ajouterLigneCQ(cq, index === 0);
                    });
                } else {
                    for (let i = 0; i < 8; i++) {
                        window.ajouterLigneCQ(null, i === 0);
                    }
                }

                if (data.tiersObserve) {
                    const radios = document.querySelectorAll('.tiers-radio');
                    radios.forEach(r => {
                        if (r.value === data.tiersObserve) r.checked = true;
                    });
                }

                document.getElementById('sectionRueDe').value = data.sectionRueDe || data.sectionRue || '';
                document.getElementById('sectionRueA').value = data.sectionRueA || '';
                
                document.getElementById('dateHeureObservation').value = data.dateHeureObservation || '';
                document.getElementById('commentaires').value = data.commentaires || '';

                document.getElementById('vue-accueil').classList.add('d-none');
                document.getElementById('vue-saisie').classList.remove('d-none');

            } catch (e) {
                console.error("Erreur chargement modification :", e);
                alert("Erreur lors de la récupération des données.");
            }
        };

        window.executerRecherche = async () => {
            const critere = document.getElementById('critereRecherche').value.trim().toLowerCase();
            if (!critere) {
                alert("Veuillez entrer un terme de recherche.");
                return;
            }

            bootstrap.Modal.getInstance(document.getElementById('modalRecherche')).hide();
            const contenu = document.getElementById('contenu-zone');
            document.getElementById('titre-zone').textContent = `Résultats de recherche pour : "${critere}"`;
            contenu.innerHTML = "<p>Recherche en cours...</p>";

            try {
                const querySnapshot = await getDocs(collection(db, "CQ"));
                let resultats = [];

                querySnapshot.forEach((docSnap) => {
                    let data = docSnap.data();
                    let nomEmp = (data.nomEmploye || "").toLowerCase();
                    let idEmp = (data.idEmploye || "").toLowerCase();
                    let itineraire = (data.itineraire || "").toLowerCase();
                    let rueDe = (data.sectionRueDe || data.sectionRue || "").toLowerCase();
                    let rueA = (data.sectionRueA || "").toLowerCase();
                    
                    let matchCQ = false;
                    let listeCQ = data.cqObserveListe || (data.cqObserve ? [data.cqObserve] : []);
                    listeCQ.forEach(cq => {
                        let nomCQ = (cq.nomCQ || "").toLowerCase();
                        let codageCQ = (cq.codage || "").toLowerCase();
                        if (nomCQ.includes(critere) || codageCQ.includes(critere)) matchCQ = true;
                    });

                    if (nomEmp.includes(critere) || idEmp.includes(critere) || itineraire.includes(critere) || rueDe.includes(critere) || rueA.includes(critere) || matchCQ) {
                        resultats.push({
                            id: docSnap.id,
                            ...data
                        });
                    }
                });

                if (resultats.length === 0) {
                    contenu.innerHTML = "<p class='text-muted fs-5'>Aucune observation trouvée pour ce critère.</p>";
                    return;
                }

                construireTableauObservations(resultats);

            } catch (e) {
                console.error("Erreur lors de la recherche :", e);
                contenu.innerHTML = "<p class='text-danger'>Erreur lors de la recherche.</p>";
            }
        };
    </script>
</body>
</html>
